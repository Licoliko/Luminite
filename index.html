function spawnBossProjectile(bossX,bossY,targetX,targetY){
  const dx=targetX-bossX, dy=targetY-bossY;
  const dist=Math.hypot(dx,dy)||1;
  const spd=4;
  particles.push({wx:bossX,wy:bossY,vx:dx/dist*spd,vy:dy/dist*spd,life:80,maxLife:80,color:'#8800FF',glow:'#CC44FF',type:'proj',r:8,dmg:12});
}

// ─── PLAYER PROJECTILE ────────────────────────────────────────
function spawnPlayerProjectile(n){
  const ch=player.char;
  const dmg=ch.atk*(n===3?5:n===2?3:2);
  const spd=13; // 速度アップ（旧10）
  const ox=player.wx + player.facing*18;
  const oy=player.wy - 10; // 手の高さ（敵のGY_MIDに当たる距離）
  const shots=n===3?3:n===2?2:1;
  const spread=n===3?0.22:n===2?0.1:0;
  for(let i=0;i<shots;i++){
    const aOff=(i-(shots-1)/2)*spread;
    const vx=Math.cos(aOff)*spd*player.facing;
    const vy=Math.sin(aOff)*spd;
    particles.push({
      wx:ox, wy:oy,
      vx, vy,
      life:200, maxLife:200, // 飛距離大幅アップ（旧120）
      color:ch.c.magic, glow:ch.c.mglow, spark:ch.c.spark,
      type:'pproj',
      r: n===3?11:n===2?9:8,
      dmg,
      hitSet: new Set(),
    });
  }
  spawnHitSpark(ox,oy,ch.c.spark,6);
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.wx+=p.vx; p.wy+=p.vy;
    p.vx*=.93; p.vy+=p.type==='proj'||p.type==='pproj'?0:.15;
    p.life--;

    // Boss projectile → hit player
    if(p.type==='proj'&&player.invTimer===0){
      const dist=Math.hypot((p.wx-cameraX)-player.sx, p.wy-player.wy);
      if(dist<20){
        player.hp-=p.dmg; player.hurtTimer=20; player.invTimer=45; player.state='hurt';
        spawnHitSpark(player.wx,player.wy,'#FF0000',6); shake(8); sfx('hurt');
        if(player.hp<=0){player.hp=0;if(player.lives>1){player.lives--;player.hp=player.maxHp;player.invTimer=120;}else{gs=ST.OVER;gTimer=0;}}
        p.life=0;
      }
    }

    // Player projectile → hit enemies / boss
    if(p.type==='pproj'&&p.life>0){
      for(const en of enemies){
        if(!p.hitSet.has(en)&&Math.abs(en.wx-p.wx)<32&&Math.abs(en.wy-p.wy)<44){
          hitEnemy(en,p.dmg,p.color); p.hitSet.add(en);
          spawnHitSpark(p.wx,p.wy,p.spark||p.color,5);
          score+=5; p.life=0; break;
        }
      }
      // 魔法弾がプロップに当たる
      if(p.life>0){
        for(const pr of props){
          if(!pr.dead&&Math.abs(pr.wx-p.wx)<38&&Math.abs(pr.wy-p.wy)<44){
            hitProp(pr,p.dmg); p.life=0; break;
          }
        }
      }
      if(p.life>0&&boss&&boss.state!=='intro'&&boss.state!=='dead'){
        if(Math.abs(boss.wx-p.wx)<55&&Math.abs(boss.wy-p.wy)<55){
          hitBoss(p.dmg,p.color);
          spawnHitSpark(p.wx,p.wy,p.spark||p.color,8);
          score+=8; p.life=0;
        }
      }
    }

    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    const sx=p.wx-cameraX, sy=p.wy;
    const ratio=p.life/p.maxLife;
    ctx.globalAlpha=ratio;
    if(p.type==='spark'){
      ctx.fillStyle=p.color; ctx.fillRect(~~(sx-p.r/2),~~(sy-p.r/2),~~p.r,~~p.r);
    }else if(p.type==='magic'||p.type==='proj'){
      ctx.fillStyle=p.glow||p.color;
      ctx.beginPath();ctx.arc(~~sx,~~sy,p.r*ratio,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(~~sx,~~sy,p.r*ratio*.5,0,Math.PI*2);ctx.fill();
      if(p.type==='proj'){
        ctx.globalAlpha=ratio*.5;ctx.fillStyle=p.glow;
        ctx.beginPath();ctx.arc(~~sx,~~sy,p.r*ratio*1.5,0,Math.PI*2);ctx.fill();
      }
    }else if(p.type==='flash'){
      ctx.fillStyle=p.color; ctx.globalAlpha=ratio*.5;
      ctx.beginPath();ctx.arc(~~sx,~~sy,p.r*ratio,0,Math.PI*2);ctx.fill();
    }else if(p.type==='pproj'){
      // Motion trail (drawn behind)
      for(let t=1;t<=5;t++){
        ctx.globalAlpha=ratio*(0.28-t*.05);
        ctx.fillStyle=p.glow;
        ctx.beginPath();
        ctx.arc(~~(sx-p.vx*t),~~(sy-p.vy*t),p.r*(1-t*.12)*ratio,0,Math.PI*2);
        ctx.fill();
      }
      // Outer glow
      ctx.globalAlpha=ratio*.45;
      ctx.fillStyle=p.glow;
      ctx.beginPath();ctx.arc(~~sx,~~sy,p.r*1.9*ratio,0,Math.PI*2);ctx.fill();
      // Mid ring
      ctx.globalAlpha=ratio*.75;
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(~~sx,~~sy,p.r*ratio,0,Math.PI*2);ctx.fill();
      // Bright white core
      ctx.globalAlpha=ratio*.95;
      ctx.fillStyle='#FFFFFF';
      ctx.beginPath();ctx.arc(~~sx,~~sy,p.r*.38*ratio,0,Math.PI*2);ctx.fill();
    }else if(p.type==='star'){
      ctx.fillStyle=p.color; ctx.globalAlpha=ratio;
      ctx.fillRect(~~(sx-2),~~(sy-2),4,4);
      ctx.fillRect(~~sx,~~(sy-4),1,8);
      ctx.fillRect(~~(sx-4),~~sy,8,1);
    }else if(p.type==='num'){
      ctx.globalAlpha=Math.min(ratio*3,1);
      ctx.font='bold 18px monospace'; ctx.fillStyle=p.color;
      ctx.shadowColor=p.color; ctx.shadowBlur=8;
      ctx.textAlign='center'; ctx.fillText(p.val,~~sx,~~sy);
      ctx.shadowBlur=0;
    }else if(p.type==='afterimage'){
      // ダッシュアフターイメージ
      const ratio2=p.life/p.maxLife;
      ctx.save(); ctx.globalAlpha=ratio2*.45; ctx.translate(~~sx,~~sy);
      if((p.facing||1)===-1) ctx.scale(-1,1);
      ctx.fillStyle=p.color||'#AAAAFF';
      ctx.fillRect(-9,-42,18,42);
      ctx.restore();
    }else if(p.type==='slash'){
      // ★ 3コンボ目スラッシュライン
      ctx.save(); ctx.translate(~~sx,~~sy); ctx.rotate(p.angle||0);
      const sw=p.w*ratio; const sh=6+4*ratio;
      ctx.globalAlpha=ratio*.85;
      const sg=ctx.createLinearGradient(-sw/2,0,sw/2,0);
      sg.addColorStop(0,'transparent'); sg.addColorStop(0.3,p.glow||p.color); sg.addColorStop(0.7,p.color); sg.addColorStop(1,'transparent');
      ctx.fillStyle=sg; ctx.fillRect(-sw/2,-sh/2,sw,sh);
      ctx.globalAlpha=ratio*.4;
      ctx.fillStyle=p.glow||p.color; ctx.fillRect(-sw/2,-sh,sw,sh*2);
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}

// ─── PLAYER ───────────────────────────────────────────────────
const player={
  wx:300, wy:GY_MID,
  vx:0, vy:0,
  get sx(){ return this.wx-cameraX; },
  get sy(){ return this.wy; },
  char:null,
  hp:100, maxHp:100,
  mp:100, maxMp:100,
  state:'idle', facing:1, frame:0, fTimer:0,
  combo:0, comboTimer:0, atkTimer:0,
  hurtTimer:0, invTimer:0,
  isJump:false, jumpVy:0, groundY:GY_MID,
  lives:3, mpRegen:0,
  transGauge:0, transTimer:0, transformed:false,
  // Phase A
  hitstop:0,
  isDash:false, dashTimer:0, dashVx:0, dashCooldown:0,
  lastDirKey:'', lastDirTime:0,
  // Phase B
  airCombo:0,        // 空中コンボカウント
  isSlamming:false,  // 叩きつけ中
  slamHit:false,     // 叩きつけが地面に当たったか
};

const TRANS_DURATION=1800;

function initPlayer(charIdx){
  const ch=CHARS[charIdx];
  player.char=ch;
  player.hp=player.maxHp=ch.hp;
  player.mp=player.maxMp=ch.mp;
  player.wx=300; player.wy=GY_MID;
  player.state='idle'; player.facing=1;
  player.combo=0; player.atkTimer=0; player.hurtTimer=0; player.kickCount=0;
  player.isJump=false; player.lives=3; player.invTimer=0;
  player.transGauge=0; player.transTimer=0; player.transformed=false;
  player.hitstop=0; player.isDash=false; player.dashTimer=0;
  player.dashCooldown=0; player.lastDirKey=''; player.lastDirTime=0;
  player.airCombo=0; player.isSlamming=false; player.slamHit=false;
  player.hitCombo=0; player.hitComboTimer=0;
}

function updatePlayer(){
  const ch=player.char;

  // ─ プレイヤー側ヒットストップ ─────────────────────────────
  if(player.hitstop>0){ player.hitstop--; return; }

  const spd=ch.spd*(player.transformed?1.4:1)*(player.isDash?0:1);

  if(player.atkTimer>0)  player.atkTimer--;
  if(player.hurtTimer>0) player.hurtTimer--;
  if(player.comboTimer>0) player.comboTimer--;
  if(player.invTimer>0)  player.invTimer--;
  if(player.dashCooldown>0) player.dashCooldown--;
  if(player.comboTimer===0) player.combo=0;
  if((player.hitComboTimer||0)>0) player.hitComboTimer--;
  if(player.hitComboTimer===0) player.hitCombo=0;

  // Transform timer
  if(player.transformed){
    player.transTimer--;
    if(player.transTimer<=0){
      player.transformed=false; player.transGauge=0;
      spawnMagicBurst(player.wx,player.wy,ch.c.magic,ch.c.mglow);
    }
    if(gTimer%4===0) particles.push({wx:player.wx+(Math.random()-.5)*20,wy:player.wy-40+Math.random()*50,vx:(Math.random()-.5)*.5,vy:-1.5,life:30,maxLife:30,color:ch.c.magic,glow:ch.c.mglow,type:'magic',r:3});
  }

  player.mpRegen++;
  if(player.mpRegen>=120){ player.mp=Math.min(player.maxMp,player.mp+1); player.mpRegen=0; }

  // ─ ジャンプ物理 ──────────────────────────────────────────
  if(player.isJump||player.isSlamming){
    player.wy+=player.jumpVy;
    player.jumpVy+= player.isSlamming ? 2.2 : 0.65; // 叩きつけは急速落下
    if(player.wy>=player.groundY){
      player.wy=player.groundY; player.isJump=false; player.jumpVy=0;
      player.airCombo=0;
      if(player.state==='kick') player.state='idle';
      if(player.isSlamming&&!player.slamHit){
        player.isSlamming=false; player.slamHit=false;
        _triggerSlam(); // 叩きつけ着地エフェクト
        player.state='idle';
      } else {
        player.isSlamming=false; player.slamHit=false;
      }
    }
  }

  // ─ ダッシュ更新 ──────────────────────────────────────────
  if(player.isDash){
    player.dashTimer--;
    player.wx=Math.max(60,Math.min(WORLD_W-60, player.wx+player.dashVx));
    // ダッシュ中は軽い無敵
    if(player.dashTimer<=4) player.invTimer=Math.max(player.invTimer,4);
    // アフターイメージ
    if(gTimer%2===0) particles.push({
      wx:player.wx, wy:player.wy, vx:0, vy:0,
      life:8, maxLife:8, color:ch.c.hair+'66', glow:ch.c.magic,
      type:'afterimage', facing:player.facing, char:ch, state:player.state, frame:player.frame
    });
    if(player.dashTimer<=0){
      player.isDash=false; player.dashVx=0;
      player.dashCooldown=18;
      if(player.state==='dash') player.state='idle';
    }
    // ダッシュ中は通常移動スキップ（攻撃入力のみ受け付ける）
    goto_input: {
      if(player.state==='hurt'&&player.hurtTimer>0) break goto_input;
      if(player.atkTimer>0&&(player.state.startsWith('atk')||player.state==='kick'||player.state==='dashAtk')) break goto_input;
      if(jp('KeyZ')||jp('KeyJ')) startDashAttack();
      if(jp('Space')&&!player.isJump){ player.isJump=true; player.jumpVy=-12; player.isDash=false; player.state='jump'; sfx('jump'); }
    }
    _tickAnim(); _updateCamera(); return;
  }

  if(player.state==='hurt'&&player.hurtTimer>0) return;
  if(player.atkTimer>0&&(player.state.startsWith('atk')||player.state==='kick'||player.state==='dashAtk')) return;

  // ─ 通常移動 ──────────────────────────────────────────────
  let dx=0, dy=0;
  const leftHeld =kh('ArrowLeft') ||kh('KeyA');
  const rightHeld=kh('ArrowRight')||kh('KeyD');
  const upHeld   =kh('ArrowUp')   ||kh('KeyW');
  const downHeld =kh('ArrowDown') ||kh('KeyS');

  // ダッシュ：2連押し検出
  const now=gTimer;
  if(jp('ArrowLeft')||jp('KeyA')){
    if(player.lastDirKey==='L'&&now-player.lastDirTime<14&&player.dashCooldown===0&&!player.isJump){
      _startDash(-1);
    } else { player.lastDirKey='L'; player.lastDirTime=now; }
  }
  if(jp('ArrowRight')||jp('KeyD')){
    if(player.lastDirKey==='R'&&now-player.lastDirTime<14&&player.dashCooldown===0&&!player.isJump){
      _startDash(1);
    } else { player.lastDirKey='R'; player.lastDirTime=now; }
  }
  if(player.isDash){ _tickAnim(); _updateCamera(); return; } // ダッシュ開始直後

  if(leftHeld)  dx=-spd;
  if(rightHeld) dx=+spd;
  if(upHeld)    dy=-spd*.55;
  if(downHeld)  dy=+spd*.55;
  if(dx!==0||dy!==0){
    player.wx=Math.max(60,Math.min(WORLD_W-60,player.wx+dx));
    if(!player.isJump) player.wy=Math.max(GY_MIN+10,Math.min(GY_MAX-10,player.wy+dy));
    if(!player.isJump) player.groundY=player.wy;
    if(dx!==0) player.facing=dx>0?1:-1;
    if(!player.isJump&&player.state!=='walk'){player.state='walk';player.frame=0;}
  } else if(!player.isJump&&player.state==='walk'){player.state='idle';player.frame=0;}
  if(!player.isJump) player.wy=Math.max(GY_MIN+10,Math.min(GY_MAX-10,player.wy));

  // ─ ジャンプ入力 ──────────────────────────────────────────
  if(jp('Space')&&!player.isJump){
    player.isJump=true; player.jumpVy=-12; player.state='jump'; sfx('jump');
  }

  // ─ 変身 ─────────────────────────────────────────────────
  if(jp('ShiftLeft')||jp('ShiftRight')){
    const dc=diffConf();
    if(!player.transformed&&player.transGauge>=dc.trans_req){
      player.transformed=true; player.transTimer=TRANS_DURATION; player.transGauge=100;
      spawnTransformBurst(player.wx,player.wy,ch); shake(12); sfx('transform');
      const blastR=150;
      for(const en of enemies){
        const dist=Math.hypot(en.wx-player.wx,en.wy-player.wy);
        if(dist<blastR){
          const blastDmg=~~(ch.atk*3*(1-dist/blastR));
          hitEnemy(en,blastDmg,ch.c.magic);
          en.vx=(en.wx-player.wx)/dist*18; en.state='hurt'; en.hurtTimer=30;
          spawnHitSpark(en.wx,en.wy,ch.c.mglow,8);
        }
      }
      if(boss){ const d=Math.hypot(boss.wx-player.wx,boss.wy-player.wy); if(d<blastR) hitBoss(~~(ch.atk*4),ch.c.magic); }
    }
  }

  // ─ 攻撃入力 ──────────────────────────────────────────────
  if(jp('KeyZ')||jp('KeyJ')){
    const idx=CHARS.indexOf(player.char);
    const maxCombo=[3,4,5,3][idx]||3;
    if(player.isJump||player.isSlamming){
      // ─ 空中攻撃 ─
      const downHeld2=kh('ArrowDown')||kh('KeyS');
      if(downHeld2 && !player.isSlamming){
        // ↓+Z = 叩きつけ
        _startSlam();
      } else if(!player.isSlamming){
        // 通常空中攻撃（空中コンボ）
        _airAttack();
      }
    } else {
      if(player.combo===0||player.comboTimer===0) startAttack(1);
      else if(player.combo<maxCombo) startAttack(player.combo+1);
    }
  }

  // ─ 必殺技 ────────────────────────────────────────────────
  if(jp('KeyX')||jp('KeyK')){
    if(player.transformed&&player.mp>=player.maxMp) activateHissatsu();
  }

  _tickAnim(); _updateCamera();
}

// ─── PHASE B: 空中コンボ・叩きつけ ────────────────────────────
function _airAttack(){
  const ch=player.char;
  const ac=player.airCombo;
  // 空中コンボは最大4回（4回目は自動的に叩きつけ移行）
  if(ac>=4){ _startSlam(); return; }
  player.airCombo++;
  player.atkTimer=7; player.frame=0;
  player.state=ac%2===0?'kick':'atk2'; // キック/パンチ交互
  if(player.state==='kick'){ player.kickCount=(player.kickCount||0)+1; }

  const dmgMult=1.5+ac*0.4; // コンボが深いほど威力UP
  let hit=false;
  // 空中判定：Y軸に広めのヒットボックス（空中の敵も地上の敵も狙える）
  for(const en of enemies){
    const exd=en.wx-player.wx, eyd=en.wy-player.wy;
    const range=ch.range+20;
    if(Math.abs(exd)<range&&Math.abs(eyd)<80){
      if(en.isAirborne){
        // 空中の敵を追撃：さらに浮かせる
        en.airVy=Math.min(en.airVy||0, -6);
        en.hitstop=5;
        hitEnemy(en,~~(ch.atk*dmgMult),ch.c.spark);
      } else {
        // 地上の敵には打ち上げ
        launchEnemy(en,~~(ch.atk*dmgMult),'up');
      }
      hit=true;
    }
  }
  if(hit){
    spawnHitSpark(player.wx+player.facing*30,player.wy-20,ch.c.spark,9);
    // エアバウンス：プレイヤーが敵を叩くたびに少し浮く
    player.jumpVy=Math.min(player.jumpVy, -3.5);
    player.hitstop=4;
    player.hitCombo=(player.hitCombo||0)+1; player.hitComboTimer=60;
    score+=20*player.airCombo; shake(5);
    sfx(['atk1','atk2','atk1','atk3'][ac%4]);
  }
}

function _startSlam(){
  player.isSlamming=true; player.slamHit=false;
  player.jumpVy=16; // 急速落下
  player.isJump=true;
  player.state='atk3'; player.frame=0; player.atkTimer=0;
  sfx('atk2');
  const ch=player.char;
  // 叩きつけ中の残像（赤）
  particles.push({wx:player.wx,wy:player.wy,vx:0,vy:0,
    life:14,maxLife:14,color:ch.c.spark+'99',type:'flash',r:28});
}

function _triggerSlam(){
  const ch=player.char;
  shake(18);
  sfx('atk3');
  // 地面衝撃波：周囲120px内の地上の敵に大ダメージ
  const slamR=120;
  let count=0;
  for(const en of enemies){
    if(!en.isAirborne){
      const d=Math.hypot(en.wx-player.wx, en.wy-player.wy);
      if(d<slamR){
        const dmg=~~(ch.atk*4*(1-d/slamR*0.5));
        hitEnemy(en,dmg,ch.c.spark);
        // 衝撃で周囲に飛ばす
        en.vx=(en.wx-player.wx)/Math.max(d,1)*12;
        en.state='hurt'; en.hurtTimer=20;
        count++;
      }
    } else {
      // 空中の敵も落下させる
      en.airVy=Math.max(en.airVy||0, 8);
    }
  }
  // 衝撃波パーティクル（リング状）
  for(let i=0;i<20;i++){
    const a=i/20*Math.PI*2;
    particles.push({
      wx:player.wx+Math.cos(a)*12, wy:player.wy,
      vx:Math.cos(a)*6, vy:Math.sin(a)*2-1,
      life:18, maxLife:18,
      color:ch.c.spark, glow:ch.c.magic, type:'spark', r:5
    });
  }
  // 地面フラッシュ
  particles.push({wx:player.wx,wy:player.wy,vx:0,vy:0,
    life:12,maxLife:12,color:ch.c.magic+'CC',type:'flash',r:slamR});
  if(count>0){
    player.hitCombo=(player.hitCombo||0)+count; player.hitComboTimer=60;
    score+=50*count;
  }
  player.airCombo=0;
}

function _startDash(dir){
  player.isDash=true; player.dashTimer=14;
  player.facing=dir;
  player.dashVx=dir*16*(player.transformed?1.4:1);
  player.state='dash'; player.frame=0;
  sfx('cursor');
  // ダッシュ開始の小さなスパーク
  const ch=player.char;
  particles.push({wx:player.wx,wy:player.wy,vx:0,vy:0,life:8,maxLife:8,color:ch.c.magic+'88',type:'flash',r:30});
}

function startDashAttack(){
  const ch=player.char;
  player.isDash=false; player.dashVx=0; player.dashTimer=0;
  player.state='dashAtk'; player.atkTimer=12; player.frame=0;
  sfx('atk2'); shake(4);
  const atkRange=ch.range+40; // ダッシュ攻撃は長リーチ
  let hit=false;
  for(const en of enemies){
    const exd=en.wx-player.wx, eyd=en.wy-player.wy;
    if(exd*player.facing>0&&Math.abs(exd)<atkRange&&Math.abs(eyd)<50){
      launchEnemy(en,~~(ch.atk*2.2),'fly'); // 横に吹き飛ばす
      hit=true;
    }
  }
  if(hit){ player.hitstop=5; player.hitCombo=(player.hitCombo||0)+2; player.hitComboTimer=55; score+=30; }
}

function _tickAnim(){
  player.fTimer++;
  const fSpeed=player.state==='walk'?5:player.state==='idle'?28:player.state==='dash'?3:player.state.startsWith('atk')?1:player.state==='jump'?2:5;
  if(player.fTimer>=fSpeed){ player.fTimer=0; player.frame++; }
}

function _updateCamera(){
  const sx=player.sx;
  if(sx<CAM_LEFT)  cameraX=Math.max(0,cameraX-(CAM_LEFT-sx)*.12);
  if(sx>CAM_RIGHT) cameraX=Math.min(WORLD_W-W,cameraX+(sx-CAM_RIGHT)*.12);
}

function startAttack(n){
  player.combo=n; player.comboTimer=26; // チェーン猶予フレーム
  player.atkTimer=n>=4?9:n===3?11:8;   // 高速化（旧16/22）
  player.frame=0;
  player.state=`atk${n}`;

  if(player.transformed){
    const ch=player.char;
    const maxTransCombo=3; // 変身コンボは3段固定
    const isFinal = (n>=maxTransCombo);
    sfx('magic');
    // 毎コンボ飛び道具を発射
    spawnPlayerProjectile(Math.min(n,3));
    score+=8*n;
    // 近距離の敵にも直接当たり判定（飛び道具と別）
    const closeR=80;
    let hit=false;
    for(let ei=enemies.length-1;ei>=0;ei--){
      const en=enemies[ei];
      const dist=Math.hypot(en.wx-player.wx, en.wy-player.wy);
      if(dist<closeR){
        const dmg=~~(ch.atk*n*1.8);
        if(isFinal && !boss){
          // 最終段：画面端まで吹き飛ばす（ボス以外）
          _blastToEdge(en, dmg, ch.c.spark);
        } else {
          hitEnemy(en, dmg, ch.c.spark);
        }
        hit=true;
      }
    }
    // ボスには通常ヒット（吹き飛ばしなし）
    if(boss&&Math.hypot(boss.wx-player.wx,boss.wy-player.wy)<closeR+40){
      hitBoss(~~(ch.atk*n*1.5),ch.c.spark); hit=true;
    }
    if(hit){
      player.hitstop=isFinal?8:5;
      player.hitCombo=(player.hitCombo||0)+1; player.hitComboTimer=55;
      spawnHitSpark(player.wx+player.facing*40,player.wy-20,ch.c.magic,isFinal?14:9);
      if(isFinal){ shake(14); triggerSlowmo(18); triggerZoom(1.14,24); }
      else { shake(5); }
    }
    return;
  }

  sfx(['','atk1','atk2','atk3','atk3','atk3'][Math.min(n,5)]);
  const ch=player.char;
  const mult=n>=4?n*1.3:n===3?3:n===2?2:1;
  const atkRange=ch.range+(n>=3?30:0)+(n>=5?20:0);
  const atkDepth=40; // Y軸当たり判定幅（奥行きあり）

  // 自動接近：地上攻撃時、近くの敵に向かってXY両方スライド
  if(!player.isJump){
    let nearestEn=null, nearestDist=Infinity;
    for(const en of enemies){
      const exd=en.wx-player.wx, eyd=en.wy-player.wy;
      if(exd*player.facing>0&&Math.abs(exd)<atkRange*2.5&&Math.abs(eyd)<atkDepth*3){
        const d=Math.hypot(exd,eyd);
        if(d<nearestDist){nearestDist=d;nearestEn=en;}
      }
    }
    if(nearestEn&&nearestDist>atkRange*.4){
      const dx=nearestEn.wx-player.wx, dy=nearestEn.wy-player.wy;
      const slideX=Math.min(Math.abs(dx)-atkRange*.3, player.char.spd*3);
      const slideY=Math.sign(dy)*Math.min(Math.abs(dy), player.char.spd*2);
      if(slideX>0) player.wx+=player.facing*slideX;
      player.wy=Math.max(GY_MIN+10,Math.min(GY_MAX-10,player.wy+slideY));
      player.groundY=player.wy;
    }
  }

  let hit=false;
  for(const en of enemies){
    const exd=en.wx-player.wx, eyd=en.wy-player.wy;
    if(exd*player.facing>0&&Math.abs(exd)<atkRange&&Math.abs(eyd)<atkDepth){
      if(n>=3 && !en.isAirborne){
        launchEnemy(en,~~(ch.atk*mult),n>=4?'fly':'up'); // 3コンボ以降は打ち上げ
      } else {
        hitEnemy(en,~~(ch.atk*mult),ch.c.spark);
      }
      hit=true;
    }
  }
  // プロップへの攻撃（向き不問・広め判定）
  for(const pr of props){
    const exd=pr.wx-player.wx, eyd=pr.wy-player.wy;
    if(!pr.dead&&Math.abs(exd)<atkRange+30&&Math.abs(eyd)<atkDepth+20){
      hitProp(pr,~~(ch.atk*mult)); hit=true;
    }
  }
  if(boss){
    const exd=boss.wx-player.wx, eyd=boss.wy-player.wy;
    if(exd*player.facing>0&&Math.abs(exd)<atkRange*1.3&&Math.abs(eyd)<atkDepth*1.5){
      hitBoss(~~(ch.atk*mult),ch.c.spark); hit=true;
    }
  }
  if(hit){
    player.hitCombo=(player.hitCombo||0)+1;
    player.hitComboTimer=50;
    spawnHitSpark(player.wx+player.facing*atkRange*.5,player.wy,ch.c.spark,n>=4?12:8);
    if(n>=3) spawnMagicBurst(player.wx+player.facing*atkRange*.5,player.wy,ch.c.magic,ch.c.mglow,n>=4);
    if(n>=3){
      particles.push({wx:player.wx+player.facing*20,wy:player.wy-20,vx:player.facing*8,vy:-1,
        life:12,maxLife:12,color:ch.c.spark,glow:ch.c.magic,type:'slash',w:atkRange*1.2,angle:player.facing>0?-0.2:0.2});
    }
    score+=~~(10*mult); shake(n>=4?14:n===3?10:4);
  }
}

// ─── PHASE C: 演出強化 ────────────────────────────────────────
let slowmoTimer=0;       // KOスロー
let zoomScale=1.0;       // カメラズーム（1.0=通常、<1=引き）
let zoomTarget=1.0;
let comboBgFlash=0;      // コンボ連続中の背景暗転

function triggerSlowmo(frames=22){
  slowmoTimer=frames;
}
function triggerZoom(target=1.14, frames=30){
  zoomTarget=target;
  setTimeout(()=>{ zoomTarget=1.0; }, frames*16);
}

// 毎フレーム呼ぶ演出更新
function updatePhaseC(){
  if(slowmoTimer>0) slowmoTimer--;
  // ズームを滑らかに補間
  zoomScale+=(zoomTarget-zoomScale)*.12;
  // コンボ背景フラッシュ更新
  if(comboBgFlash>0) comboBgFlash--;
}

// ズーム用のcanvas変換を適用（drawゲームコンテンツ前に呼ぶ）
function applyZoom(){
  if(Math.abs(zoomScale-1.0)>0.002){
    ctx.save();
    ctx.translate(W/2,H/2);
    ctx.scale(zoomScale,zoomScale);
    ctx.translate(-W/2,-H/2);
  }
}
function restoreZoom(){
  if(Math.abs(zoomScale-1.0)>0.002) ctx.restore();
}

// コンボ数に応じた背景演出（画面端の彩度）
function drawComboBgFx(){
  const hc=player.hitCombo||0;
  if(hc<5) return;
  const intensity=Math.min((hc-4)*0.02, 0.25);
  const ch=player.char;
  const ga=ctx.globalAlpha;
  ctx.globalAlpha=intensity+Math.sin(gTimer*.1)*.04;
  // 画面端グロー
  const edge=ctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.8);
  edge.addColorStop(0,'transparent');
  edge.addColorStop(1,ch.c.magic+'88');
  ctx.fillStyle=edge; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=ga;
}

// KOスローモーション（ゲームループから呼ぶ）
function isSlowmo(){ return slowmoTimer>0 && gTimer%3!==0; }
// 画面端まで吹き飛ばす（変身最終段専用）
function _blastToEdge(en, dmg, color){
  en.hp-=dmg;
  spawnDamageNum(en.wx,en.wy-20,dmg,color);
  en.hitstop=4;
  en.isAirborne=true;
  en.airVx=player.facing*32;
  en.airVy=-5;
  en.bounceCount=10; // 高い値でバウンドなし即消え
  en.state='airborne';
  for(let i=0;i<5;i++){
    particles.push({wx:en.wx-player.facing*i*18,wy:en.wy,vx:0,vy:0,
      life:10-i*2,maxLife:10,color:color+'88',type:'flash',r:18-i*3});
  }
  spawnHitSpark(en.wx,en.wy,color,12);
  player.mp=Math.min(player.maxMp,player.mp+6);
}

let hissatsuTimer=0, cutinTimer=0, cutinCharIdx=-1;

function activateHissatsu(){
  const ch=player.char;
  player.mp=0; player.state='atk3'; player.atkTimer=35; player.frame=0;
  shake(20); sfx('transform');
  hissatsuTimer=160;
  cutinTimer=70; cutinCharIdx=CHARS.indexOf(ch); // カットイン開始

  const idx=CHARS.indexOf(ch);
  setTimeout(()=>{
    if(gs!==ST.PLAY&&gs!==ST.BOSS) return;
    switch(idx){
      case 0: hissatsu_Mimi(ch); break;
      case 1: hissatsu_Rei(ch); break;
      case 2: hissatsu_Erin(ch); break;
      case 3: hissatsu_Hana(ch); break;
    }
  }, 600); // カットイン後に技発動
}

// カットイン描画（毎フレームdrawHUD前に呼ぶ）
function drawHissatsuCutin(){
  if(cutinTimer<=0) return;
  const ch=CHARS[cutinCharIdx]; if(!ch) return;
  const t=cutinTimer;

  // Phase 1 (t>58): 白フラッシュ
  if(t>58){
    ctx.globalAlpha=(70-t)/12; ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1; cutinTimer--; return;
  }

  // Phase 2-3 (10<t<=58): カットインパネル
  ctx.globalAlpha=1;
  ctx.fillStyle='#000008'; ctx.fillRect(0,0,W,H);
  // キャラカラー背景（左側）
  const grd=ctx.createLinearGradient(0,0,W*.5,0);
  grd.addColorStop(0,ch.c.magic+'88'); grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
  // 斜めライン装飾
  ctx.strokeStyle=ch.c.tAccent||ch.c.magic; ctx.lineWidth=3; ctx.globalAlpha=.5;
  for(let i=-2;i<6;i++){ ctx.beginPath();ctx.moveTo(W*.35+i*30,0);ctx.lineTo(W*.55+i*30,H);ctx.stroke(); }
  ctx.globalAlpha=1; ctx.lineWidth=1;

  // キャラ大きく描画（左 40%）
  const cX=W*.2, cY=H*.92;
  ctx.save(); ctx.translate(cX,cY); ctx.scale(2,2);
  const stateMap=['atk2','atk3','atk3','atk2'][cutinCharIdx];
  drawHero(ch,0,0,{state:stateMap,frame:70-t,facing:1,transformed:player.transformed});
  ctx.restore();

  // 右側：技名テキスト
  if(t<50){
    const alpha=Math.min(1,(50-t)/8);
    ctx.globalAlpha=alpha;
    const hNames=[['竜巻','烈風'],['氷結','封印'],['炎嵐','烈火'],['聖光','癒し']];
    const names=hNames[cutinCharIdx]||['必殺','技'];
    ctx.shadowColor=ch.c.magic; ctx.shadowBlur=24;
    ctx.font=`900 ${~~(W*.045)}px 'Hiragino Sans','Yu Gothic',sans-serif`;
    ctx.fillStyle='#FFFFFF'; ctx.textAlign='center';
    ctx.fillText(ch.name+'の必殺技！', W*.72, H*.35);
    ctx.font=`900 ${~~(W*.08)}px 'Hiragino Sans','Yu Gothic',sans-serif`;
    ctx.fillStyle=ch.c.tAccent||'#FFCC44';
    ctx.fillText(names[0], W*.72, H*.56);
    ctx.fillStyle=ch.c.magic;
    ctx.fillText(names[1], W*.72, H*.72);
    ctx.shadowBlur=0; ctx.textAlign='left'; ctx.globalAlpha=1;
  }

  cutinTimer--;
}

// ミミ「竜巻烈風」— 画面を横断する竜巻 × 3、全敵を連続ヒット
function hissatsu_Mimi(ch){
  const dmg=ch.atk*4;
  for(let t=0;t<3;t++){
    const delay=t*18;
    setTimeout(()=>{
      if(gs!==ST.PLAY&&gs!==ST.BOSS) return;
      const startX=player.wx+(player.facing*50);
      // Tornado sweep particle stream
      for(let i=0;i<8;i++) particles.push({
        wx:startX+player.facing*i*60, wy:GY_MID+(Math.random()-.5)*80,
        vx:player.facing*7, vy:(Math.random()-.5)*2,
        life:45, maxLife:45, color:ch.c.magic, glow:ch.c.mglow, type:'pproj',
        r:14+Math.random()*6, dmg:dmg, hitSet:new Set(),
      });
      spawnMagicBurst(startX,player.wy,ch.c.magic,ch.c.mglow,true);
      shake(8);
    },delay*16);
  }
}

// レイ「氷結封印」— 全敵を3秒間氷結 + 高ダメージ
function hissatsu_Rei(ch){
  const dmg=ch.atk*6;
  spawnMagicBurst(player.wx,player.wy,ch.c.magic,ch.c.mglow,true);
  // Flash
  particles.push({wx:W/2+cameraX,wy:GY_MID,vx:0,vy:0,life:30,maxLife:30,color:'#AADDFF',type:'flash',r:500});
  // Hit all enemies with ice damage + freeze
  for(const en of enemies){
    hitEnemy(en,dmg,ch.c.magic);
    en.frozen=180; // 3s freeze
    // Icicle spears
    particles.push({wx:en.wx,wy:en.wy-30,vx:0,vy:3,life:20,maxLife:20,color:'#AADDFF',glow:'#FFFFFF',type:'magic',r:10});
  }
  if(boss){ hitBoss(~~(dmg*0.6),ch.c.magic); boss.frozen=120; }
  shake(15);
}

// エリン「紅蓮業火」— 画面全体に爆炎、全敵に最大ダメージ
function hissatsu_Erin(ch){
  const dmg=ch.atk*8;
  // Multiple explosion waves
  for(let i=0;i<5;i++) setTimeout(()=>{
    if(gs!==ST.PLAY&&gs!==ST.BOSS) return;
    const ex=cameraX+100+Math.random()*(W-200), ey=GY_MIN+30+Math.random()*(GY_MAX-GY_MIN-60);
    spawnMagicBurst(ex,ey,ch.c.magic,ch.c.mglow,true);
    spawnHitSpark(ex,ey,ch.c.spark,12);
    shake(10);
    // Hit enemies near explosion
    for(const en of enemies) if(Math.hypot(en.wx-ex,en.wy-ey)<100) hitEnemy(en,~~(dmg*0.7),ch.c.magic);
    if(boss&&Math.hypot(boss.wx-ex,boss.wy-ey)<120) hitBoss(~~(dmg*0.4),ch.c.magic);
  },i*120);
  // Direct damage to all
  for(const en of enemies) hitEnemy(en,dmg,ch.c.spark);
  if(boss) hitBoss(~~(dmg*0.5),ch.c.spark);
}

// ハナ「聖光癒しの光」— HP回復 + 光の雨で全敵ダメージ
function hissatsu_Hana(ch){
  const dmg=ch.atk*3;
  // HP restore
  const healed=Math.min(50,player.maxHp-player.hp);
  player.hp=Math.min(player.maxHp,player.hp+50);
  spawnDamageNum(player.wx,player.wy-40,`+${healed}HP`,'#AAFFAA');
  // Light rain from above
  particles.push({wx:W/2+cameraX,wy:GY_MID-20,vx:0,vy:0,life:25,maxLife:25,color:'#FFFFCC',type:'flash',r:400});
  for(let i=0;i<12;i++) setTimeout(()=>{
    if(gs!==ST.PLAY&&gs!==ST.BOSS) return;
    const lx=cameraX+60+Math.random()*(W-120);
    particles.push({wx:lx,wy:GY_MIN-10,vx:0,vy:8,life:50,maxLife:50,color:ch.c.magic,glow:'#FFFFFF',type:'pproj',r:8,dmg:~~(dmg*0.8),hitSet:new Set()});
    spawnHitSpark(lx,GY_MIN,ch.c.mglow,4);
  },i*60);
  for(const en of enemies) hitEnemy(en,dmg,ch.c.magic);
  if(boss) hitBoss(~~(dmg*0.6),ch.c.magic);
  shake(10);
}
const enemies=[];
let enemySpawnTimer=0,totalSpawned=0,totalKilled=0;
let stageEnemyCount=0, stageWaveSize=0;

const E_TYPES_S1=[
  {type:'grunt',hp:24,atk:8, spd:1.2,score:50},
  {type:'fast', hp:16,atk:6, spd:2.0,score:70},
  {type:'brute',hp:50,atk:15,spd:0.7,score:120},
];
const E_TYPES_S2=[
  {type:'grunt',hp:36,atk:12,spd:1.5,score:70},
  {type:'fast', hp:22,atk:9, spd:2.5,score:100},
  {type:'brute',hp:70,atk:20,spd:0.9,score:160},
];
const E_TYPES_S3=[
  {type:'grunt',hp:50,atk:16,spd:1.7,score:100},
  {type:'fast', hp:30,atk:12,spd:3.0,score:130},
  {type:'brute',hp:90,atk:26,spd:1.0,score:200},
];
const E_TYPES_S4=[
  {type:'grunt',hp:70,atk:20,spd:2.0,score:140},
  {type:'fast', hp:40,atk:15,spd:3.5,score:180},
  {type:'brute',hp:120,atk:32,spd:1.2,score:280},
];
const E_TYPES_ALL=[E_TYPES_S1,E_TYPES_S2,E_TYPES_S3,E_TYPES_S4];

function spawnEnemy(){
  if(totalSpawned>=stageEnemyCount) return;
  const types=E_TYPES_ALL[Math.min(currentStage,3)];
  const t=types[Math.random()<.2?2:Math.random()<.4?1:0];
  const dc=diffConf();
  // スポーン位置: 常に画面右端、Y固定
  const spawnRight=Math.random()<.85;
  const spawnWx=spawnRight
    ? player.wx+W*.55+Math.random()*200
    : player.wx-W*.55-Math.random()*200;
  const spawnWy=GY_MIN+30+Math.random()*(GY_MAX-GY_MIN-60); // 奥行き復活
  enemies.push({
    wx:spawnWx, wy:spawnWy,
    vx:0, vy:0,
    get sx(){return this.wx-cameraX;},
    get sy(){return this.wy;},
    hp:~~(t.hp*dc.en_hp), maxHp:~~(t.hp*dc.en_hp),
    atk:~~(t.atk*dc.en_atk), spd:t.spd*dc.en_spd, scoreVal:t.score,
    type:t.type, state:'walk', facing:-1,
    frame:0, fTimer:0, atkTimer:0, hurtTimer:0,
    aiState:'walk', aiTimer:0, chargeVx:0,
  });
  totalSpawned++;
}

function updateEnemies(){
  enemySpawnTimer++;
  const spawnRate=Math.max(30,80-Math.floor(totalKilled/3)*8);
  if(enemySpawnTimer>=spawnRate&&totalSpawned<stageEnemyCount&&enemies.length<stageWaveSize){
    spawnEnemy(); enemySpawnTimer=0;
  }
  for(let i=enemies.length-1;i>=0;i--){
    const en=enemies[i];
    if(!en.groundY) en.groundY=en.wy; // 初期地面Y記録
    if(en.hp<=0&&!en.isAirborne){
      score+=en.scoreVal; totalKilled++;
      spawnHitSpark(en.wx,en.wy,'#FF4400',12);
      spawnDamageNum(en.wx,en.wy-30,'撃破！','#FFAA00');
      player.transGauge=Math.min(100,player.transGauge+8);
      player.mp=Math.min(player.maxMp,player.mp+10);
      enemies.splice(i,1); continue;
    }
    // 氷結
    if(en.frozen>0){ en.frozen--; en.fTimer++; if(en.fTimer>=6){en.fTimer=0;en.frame++;} continue; }
    // ヒットストップ
    if((en.hitstop||0)>0){ en.hitstop--; en.fTimer++; continue; }
    if(en.atkTimer>0) en.atkTimer--;
    if(en.hurtTimer>0) en.hurtTimer--;

    // ─ 空中判定（打ち上げ・バウンド）─────────────────────
    if(en.isAirborne){
      en.wx+=en.airVx||0; en.wy+=(en.airVy||0); en.airVy=(en.airVy||0)+0.7;
      en.airVx=(en.airVx||0)*.88;
      en.wy=Math.min(en.wy, en.groundY||GY_MID);
      en.wx=Math.max(60,Math.min(WORLD_W-60,en.wx));
      // 叩きつけ中プレイヤーが空中敵に接触 → 追加ヒット
      if(player.isSlamming&&!player.slamHit){
        if(Math.hypot(en.wx-player.wx,en.wy-player.wy)<44){
          hitEnemy(en,~~(player.char.atk*2.5),player.char.c.spark);
          spawnHitSpark(en.wx,en.wy,player.char.c.spark,8);
          player.slamHit=true;
        }
      }
      // 着地判定
      if(en.wy>=(en.groundY||GY_MID)){
        en.wy=en.groundY||GY_MID;
        en.bounceCount=(en.bounceCount||0)+1;
        if(en.bounceCount>=2){
          // バウンド終了→KO or stagger
          en.isAirborne=false; en.airVy=0; en.airVx=0;
          if(en.hp<=0){ en.state='KO'; en.KOtimer=60; }
          else { en.state='stagger'; en.staggerTimer=30; }
          spawnHitSpark(en.wx,en.wy,'#FFAA44',8); shake(5);
        } else {
          // バウンド：高さを半分に
          en.airVy=-(en.airVy||0)*.45;
          en.airVx=(en.airVx||0)*.6;
          spawnHitSpark(en.wx,en.wy,'#FF8800',5);
        }
      }
      en.fTimer++; if(en.fTimer>=4){en.fTimer=0;en.frame++;} continue;
    }

    // ─ KOダウン ─────────────────────────────────────────
    if(en.state==='KO'){
      en.KOtimer=(en.KOtimer||0)-1;
      if(en.KOtimer<=0){
        if(en.hp<=0){ en.hp=-1; } // 次フレームで削除
        else { en.state='stagger'; en.staggerTimer=30; }
      }
      en.fTimer++; continue;
    }

    // ─ スタガー（よろめき・追撃猶予）─────────────────────
    if(en.state==='stagger'){
      en.staggerTimer=(en.staggerTimer||0)-1;
      en.vx*=.75;
      en.wx+=en.vx;
      if(en.staggerTimer<=0) en.state='walk';
      en.fTimer++; if(en.fTimer>=6){en.fTimer=0;en.frame++;} continue;
    }

    en.wy=Math.max(GY_MIN+10,Math.min(GY_MAX-10,en.wy)); // Y境界
    const dx=player.wx-en.wx;
    const dy=player.wy-en.wy;
    const dist=Math.hypot(dx,dy);
    if(dx!==0) en.facing=dx>0?1:-1;

    // ─── AI ステートマシン ────────────────
    if(en.state==='hurt'&&en.hurtTimer>0){
      // ノックバック（X方向のみ）
      en.wx+=en.vx; en.vx*=.82;
      // ダメージ後：ある程度吹き飛んだら後退ステートへ
      if(en.hurtTimer===1&&en.type!=='brute'){
        en.state='retreat'; en.aiTimer=30+~~(Math.random()*20);
      }
    } else if(en.state==='retreat'){
      // ★★ ダメージ後に少し後退
      en.wx-=en.facing*en.spd*.8;
      en.aiTimer--;
      if(en.aiTimer<=0) en.state='walk';
    } else if(en.state==='guard'){
      // ★★ brute：ガード状態（短時間、攻撃無効）
      en.aiTimer--;
      en.vx*=.7;
      if(en.aiTimer<=0){
        // ガード解除→即チャージ
        en.state='windup'; en.aiTimer=20;
      }
    } else if(en.state==='charge'){
      en.wx+=en.chargeVx;
      en.aiTimer--;
      if(dist<40&&player.invTimer===0){
        _enemyHitPlayer(en, ~~(en.atk*1.5));
        en.state='walk'; en.aiTimer=60; en.chargeVx=0;
      }
      if(en.aiTimer<=0||en.wx<60||en.wx>WORLD_W-60){
        en.state='walk'; en.aiTimer=40; en.chargeVx=0;
      }
    } else if(en.state==='windup'){
      en.aiTimer--;
      en.wx-=en.facing*0.5;
      if(en.aiTimer<=0){
        en.state='charge';
        // ★★ fast型はより速く飛びかかる
        en.chargeVx=en.facing*(en.spd*(en.type==='fast'?7.5:5.5));
        en.aiTimer=en.type==='fast'?22:28;
        spawnHitSpark(en.wx,en.wy,en.type==='fast'?'#FFCC00':'#FF8800',4);
      }
    } else if(en.state==='dashAtk'){
      // ★★ fast型専用：素早い連続ダッシュ攻撃
      en.wx+=en.chargeVx*0.6; en.aiTimer--;
      if(dist<35&&player.invTimer===0){
        _enemyHitPlayer(en, ~~(en.atk*0.8)); // 連打なので一発は弱め
        en.chargeVx=-en.chargeVx; // 折り返し
        en.aiTimer=10;
        en.dashCount=(en.dashCount||0)+1;
        if(en.dashCount>=3){ en.state='walk'; en.aiTimer=50; en.dashCount=0; en.chargeVx=0; }
      }
      if(en.aiTimer<=0){ en.state='walk'; en.aiTimer=30; en.chargeVx=0; en.dashCount=0; }
    } else if(en.state==='attack'&&en.atkTimer>0){
      // 近接攻撃モーション中
    } else {
      // ─ 通常行動 ─
      const closeRange=en.type==='brute'?80:55;
      const windupChance=en.type==='brute'?0.008:en.type==='fast'?0.018:0.012;
      if(dist>closeRange){
        en.wx+=Math.sign(dx)*en.spd;
        en.wy+=Math.sign(dy)*en.spd*.5; // Y方向も追う
        en.state='walk';
        if(dist<200&&en.atkTimer===0&&Math.random()<windupChance){
          en.state='windup'; en.aiTimer=en.type==='fast'?14:28;
        }
        // ★★ fast型：遠距離からでもダッシュ攻撃を仕掛ける
        if(en.type==='fast'&&dist<160&&en.atkTimer===0&&Math.random()<0.008){
          en.state='dashAtk'; en.chargeVx=en.facing*en.spd*4; en.aiTimer=18; en.dashCount=0;
        }
      } else {
        if(en.atkTimer===0){
          // ★★ brute型：近距離でガードを構える確率
          if(en.type==='brute'&&Math.random()<0.04){
            en.state='guard'; en.aiTimer=45;
          } else if(Math.random()<windupChance*2){
            en.state='windup'; en.aiTimer=en.type==='fast'?14:26;
          } else {
            en.state='attack';
            if(player.invTimer===0) _enemyHitPlayer(en,en.atk);
            en.atkTimer=48+(en.type==='brute'?24:0);
          }
        } else {
          en.state='walk';
        }
      }
    }
    en.fTimer++; if(en.fTimer>=6){en.fTimer=0;en.frame++;}
  }

  // ─ コリジョン分離（当たり判定には影響しない・位置のみ調整） ─
  // プレイヤー ↔ 敵：強めに押しのける
  const P_EN_X=32, P_EN_Y=22; // 分離距離（X,Y）
  for(const en of enemies){
    const dx=en.wx-player.wx, dy=en.wy-player.wy;
    const overX=P_EN_X-Math.abs(dx), overY=P_EN_Y-Math.abs(dy);
    if(overX>0&&overY>0){
      const pushX=overX*.45*Math.sign(dx||1);
      const pushY=overY*.3 *Math.sign(dy||1);
      en.wx+=pushX; en.wy+=pushY;
      // プレイヤーは軽く逆向きに（ただしhurt中は動かさない）
      if(player.state!=='hurt' && player.invTimer===0){
        player.wx-=pushX*.3;
        player.wy=Math.max(GY_MIN+10,Math.min(GY_MAX-10,player.wy-pushY*.2));
      }
      en.wy=Math.max(GY_MIN+10,Math.min(GY_MAX-10,en.wy));
    }
  }
  // 敵同士：ゆるめに押しのける
  const EN_EN_X=22, EN_EN_Y=14;
  for(let i=0;i<enemies.length;i++){
    for(let j=i+1;j<enemies.length;j++){
      const a=enemies[i], b=enemies[j];
      const dx=b.wx-a.wx, dy=b.wy-a.wy;
      const overX=EN_EN_X-Math.abs(dx), overY=EN_EN_Y-Math.abs(dy);
      if(overX>0&&overY>0){
        const pushX=overX*.3*Math.sign(dx||1);
        const pushY=overY*.2*Math.sign(dy||1);
        a.wx-=pushX; a.wy-=pushY;
        b.wx+=pushX; b.wy+=pushY;
        a.wy=Math.max(GY_MIN+10,Math.min(GY_MAX-10,a.wy));
        b.wy=Math.max(GY_MIN+10,Math.min(GY_MAX-10,b.wy));
      }
    }
  }
}

function _enemyHitPlayer(en,dmg){
  if(Math.abs(player.wy-en.wy)>45) return; // Y距離が遠すぎたら当たらない
  player.hp-=dmg; player.hurtTimer=20;
  const dc=diffConf();
  player.invTimer=dc.inv; player.state='hurt';
  player.wx-=en.facing*22;
  player.transGauge=Math.min(100,player.transGauge+5);
  spawnHitSpark(player.wx,player.wy,'#FF0000',6); shake(8); sfx('hurt');
  if(player.hp<=0){
    player.hp=0;
    if(player.lives>1){ player.lives--; player.hp=player.maxHp; player.invTimer=120; }
    else { gs=ST.OVER; gTimer=0; }
  }
}

// ─── 打ち上げ・バウンドシステム ──────────────────────────────
// mode: 'up'=打ち上げ, 'fly'=横吹き飛ばし, 'down'=叩きつけ
function launchEnemy(en, dmg, mode='up'){
  if(en.dead||en.state==='KO') return;
  en.hp-=dmg;
  spawnDamageNum(en.wx,en.wy-20,dmg,player.char.c.spark);
  spawnHitSpark(en.wx,en.wy,player.char.c.spark,10);
  player.mp=Math.min(player.maxMp,player.mp+6);
  if(en.hp<=0){ en.hp=0; return; } // hitが処理
  en.hitstop=6;
  if(mode==='up'){
    en.isAirborne=true; en.airVy=-11; en.airVx=player.facing*2.5;
    en.state='airborne'; en.bounceCount=0;
  } else if(mode==='fly'){
    en.isAirborne=true; en.airVy=-4; en.airVx=player.facing*14;
    en.state='airborne'; en.bounceCount=0;
  } else if(mode==='down'){
    // 叩きつけ：地面に強制着地
    en.isAirborne=true; en.airVy=8; en.airVx=player.facing*3;
    en.state='airborne'; en.bounceCount=2; // すぐバウンドへ
  }
}

function hitEnemy(en,dmg,color){
  if(en.state==='guard'){
    dmg=~~(dmg*0.15);
    spawnHitSpark(en.wx,en.wy,'#AAAAAA',4);
    spawnDamageNum(en.wx,en.wy-20,'ガード!','#AAAAAA');
    return;
  }
  en.hp-=dmg; en.hurtTimer=12;
  en.hitstop=6;
  const combo=player.hitCombo||0;
  const kbPow=combo>=5?10:combo>=3?7:combo>=2?5:3;
  en.vx=-player.facing*kbPow;
  en.state=combo>=2?'stagger':'hurt';
  en.staggerTimer=combo>=2?20:0;
  spawnDamageNum(en.wx,en.wy-20,dmg,color);
  const sparkSize=combo>=8?14:combo>=5?11:combo>=3?9:7;
  if(combo>=2) spawnHitSpark(en.wx,en.wy,color,sparkSize);
  player.hitstop=combo>=4?7:5;
  player.mp=Math.min(player.maxMp,player.mp+4);
  // KO判定 → スローモーション＆ズーム
  if(en.hp<=0){
    triggerSlowmo(20);
    triggerZoom(0.86, 28);
    shake(combo>=5?16:10);
  }
}

let boss=null;

const BOSS_DEFS=[
  { name:'花咲き魔獣・ブルーム',   hp:360, atk:18, spd:1.5, stageId:1, phaseThr:[1,.65,.33], chargeSpd:8,  projectile:false },
  { name:'街壊し魔将・グロウラー',   hp:560, atk:25, spd:2.0, stageId:2, phaseThr:[1,.6,.3],  chargeSpd:10, projectile:true  },
  { name:'黄昏の守護者・ダスカリオン', hp:700, atk:28, spd:1.8, stageId:3, phaseThr:[1,.55,.28],chargeSpd:9,  projectile:true, spread:true },
  { name:'星界の覇者・コスモルガ',   hp:999, atk:35, spd:2.2, stageId:4, phaseThr:[1,.5,.25], chargeSpd:12, projectile:true, spread:true, summon:true },
];

function spawnBoss(){
  const def=BOSS_DEFS[currentStage];
  const dc=diffConf();
  const bossHp=~~(def.hp*dc.boss_hp);
  boss={
    ...def,
    wx:player.wx+500, wy:GY_MID,
    vx:0,vy:0,
    get sx(){return this.wx-cameraX;},
    get sy(){return this.wy;},
    hp:bossHp, maxHp:bossHp, phase:0,
    state:'intro', facing:-1,
    frame:0,fTimer:0,atkTimer:0,hurtTimer:0,
    introTimer:180, castTimer:0,
  };
}

function updateBoss(){
  if(!boss) return;
  if(boss.hurtTimer>0) boss.hurtTimer--;
  if(boss.atkTimer>0)  boss.atkTimer--;

  // Phase transitions
  const hpRatio=boss.hp/boss.maxHp;
  if(hpRatio<boss.phaseThr[2]&&boss.phase<2) boss.phase=2;
  else if(hpRatio<boss.phaseThr[1]&&boss.phase<1) boss.phase=1;

  // Animation
  boss.fTimer++; if(boss.fTimer>=5){boss.fTimer=0;boss.frame++;}

  const dx=player.wx-boss.wx, dy=player.wy-boss.wy;
  const dist=Math.hypot(dx,dy);
  if(dx!==0) boss.facing=dx>0?1:-1;

  if(boss.state==='intro'){
    boss.introTimer--;
    boss.wx=Math.max(boss.wx-1.5,player.wx+200);
    if(boss.introTimer<=0){ boss.state='walk'; sfx('bossRoar'); }
    return;
  }

  if(boss.state==='dead'){
    boss.vx*=.9; boss.vy+=.5; boss.wy=Math.min(GY_MAX,boss.wy+boss.vy);
    return;
  }

  if(boss.state==='hurt'&&boss.hurtTimer>0){
    boss.wx+=boss.vx; boss.vx*=.85;
    return;
  }

  // AI by phase
  if(boss.atkTimer===0){
    if(boss.phase===0){
      // Walk + charge
      if(dist<500&&Math.random()<.01) startBossCharge();
      else { boss.state='walk'; boss.wx+=Math.sign(dx)*boss.spd; boss.wy+=Math.sign(dy)*boss.spd*.4; }
    } else if(boss.phase===1){
      // Walk + charge + slam
      if(dist<120&&Math.random()<.015) startBossSlam();
      else if(dist<500&&Math.random()<.01) startBossCharge();
      else { boss.state='walk'; boss.wx+=Math.sign(dx)*boss.spd*1.2; boss.wy+=Math.sign(dy)*boss.spd*.4; }
    } else {
      // All attacks + projectiles
      if(boss.projectile&&Math.random()<.01) startBossCast();
      else if(dist<140&&Math.random()<.02) startBossSlam();
      else if(dist<500&&Math.random()<.012) startBossCharge();
      else { boss.state='walk'; boss.wx+=Math.sign(dx)*boss.spd*1.4; boss.wy+=Math.sign(dy)*boss.spd*.4; }
    }
    // Summon at phase 1+ (only once per wave)
    if(boss.phase>=1&&Math.random()<.003&&enemies.length===0&&totalSpawned<stageEnemyCount+4){
      for(let i=0;i<2;i++) spawnEnemy();
    }
  }
  boss.wy=Math.max(GY_MIN+15,Math.min(GY_MAX-15,boss.wy));

  if(boss.state==='charge'){
    boss.wx+=boss.vx; boss.wy+=boss.vy;
    if(Math.abs(player.wx-boss.wx)<30&&Math.abs(player.wy-boss.wy)<60&&player.invTimer===0){
      player.hp-=boss.atk*1.5; player.hurtTimer=20; player.invTimer=60; player.state='hurt';
      player.transGauge=Math.min(100,player.transGauge+10);
      spawnHitSpark(player.wx,player.wy,'#FF0000',10); shake(15);
      if(player.hp<=0){player.hp=0;if(player.lives>1){player.lives--;player.hp=player.maxHp;player.invTimer=120;}else{gs=ST.OVER;gTimer=0;}}
    }
    boss.atkTimer=Math.max(boss.atkTimer,1);
    if(Math.abs(boss.wx-player.wx)>600||boss.atkTimer===1) boss.state='walk';
    boss.vx*=.97; boss.vy*=.97;
  }
  if(boss.state==='slam'){
    boss.slamTimer--||0;
    if((boss.slamTimer||0)<=0&&boss.atkTimer<5){
      // Impact
      spawnBossSlamWave(boss.wx,boss.wy); shake(20);
      if(Math.hypot(player.wx-boss.wx,player.wy-boss.wy)<100&&player.invTimer===0){
        player.hp-=boss.atk; player.hurtTimer=20; player.invTimer=50;
        player.transGauge=Math.min(100,player.transGauge+8);
        spawnHitSpark(player.wx,player.wy,'#FF0000',8);
        if(player.hp<=0){player.hp=0;if(player.lives>1){player.lives--;player.hp=player.maxHp;player.invTimer=120;}else{gs=ST.OVER;gTimer=0;}}
      }
      boss.state='walk';
    }
  }
  if(boss.state==='cast'&&boss.atkTimer===1){
    if(boss.spread) spawnBossSpread(boss.wx,boss.wy,player.wx,player.wy);
    else spawnBossProjectile(boss.wx,boss.wy,player.wx,player.wy);
    boss.state='walk';
  }
  // Summon minions (Stage 4 boss only)
  if(boss.summon&&boss.phase>=1&&Math.random()<.0025&&enemies.length<3){
    for(let i=0;i<2;i++) spawnEnemy();
  }
}

function startBossCharge(){
  boss.state='charge';
  const dx=player.wx-boss.wx, dy=player.wy-boss.wy;
  const dist=Math.hypot(dx,dy)||1;
  boss.vx=dx/dist*boss.chargeSpd; boss.vy=dy/dist*boss.chargeSpd*.3;
  boss.atkTimer=40; shake(5);
}
function startBossSlam(){
  boss.state='slam'; boss.atkTimer=35; boss.slamTimer=25;
}
function startBossCast(){
  boss.state='cast'; boss.atkTimer=40;
}
function spawnBossSpread(bossX,bossY,targetX,targetY){
  const baseA=Math.atan2(targetY-bossY,targetX-bossX);
  const shots=boss.phase>=2?5:3;
  const spread=0.28;
  for(let i=0;i<shots;i++){
    const a=baseA+(i-(shots-1)/2)*spread;
    particles.push({wx:bossX,wy:bossY,vx:Math.cos(a)*4,vy:Math.sin(a)*4,
      life:90,maxLife:90,color:'#8800FF',glow:'#CC44FF',type:'proj',r:7,dmg:10});
  }
}

function hitBoss(dmg,color){
  boss.hp-=dmg; boss.hurtTimer=10; boss.vx=-boss.facing*3;
  spawnDamageNum(boss.wx,boss.wy-40,dmg,color); sfx('bossHit');
  if(boss.hp<=0){
    boss.hp=0; boss.state='dead'; boss.vy=-5;
    score+=boss.stageId===1?2000:5000;
    spawnMagicBurst(boss.wx,boss.wy,'#FF4400','#FF8800',true);
    shake(25);
    setTimeout(()=>{
      if(currentStage>=3){ gs=ST.ENDING; gTimer=0; endingLine=0; endingTimer=0; }
      else { gs=ST.CLEAR; gTimer=0; }
      boss=null; sfx('clear');
    },2000);
  }
}

// ─── LUMI ROBOT ───────────────────────────────────────────────
function drawLUMI(cx,cy,scale=1,frame=0){
  const bob=Math.sin(frame*.08)*4;
  const size=72*scale; // 表示サイズ（幅）
  const drawX=~~(cx-size/2);
  const drawY=~~(cy-size*0.85+bob); // 中心より少し上（耳込みの高さ調整）

  // グローオーラ（画像の後ろ）
  ctx.save();
  const ga=ctx.globalAlpha;
  ctx.globalAlpha*=.25+Math.sin(frame*.1)*.1;
  const aura=ctx.createRadialGradient(cx,cy,size*.1,cx,cy,size*.7);
  aura.addColorStop(0,'#88EEFF'); aura.addColorStop(1,'transparent');
  ctx.fillStyle=aura; ctx.beginPath(); ctx.arc(cx,~~(cy+bob),size*.7,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=ga;

  // 画像描画（ロード済みなら）
  if(_lumiImgReady){
    ctx.drawImage(_lumiImg, drawX, drawY, size, size*(_lumiImg.height/_lumiImg.width));
  } else {
    // フォールバック：旧ドット絵
    ctx.translate(~~cx,~~(cy+bob));
    const s=scale;
    const bodyG=ctx.createRadialGradient(-6*s,-6*s,2*s,0,0,18*s);
    bodyG.addColorStop(0,'#DDFBFF');bodyG.addColorStop(.4,'#88DDEE');bodyG.addColorStop(1,'#1188AA');
    ctx.fillStyle=bodyG;ctx.beginPath();ctx.arc(0,0,18*s,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#00FFFF';ctx.beginPath();ctx.arc(-6*s,-2*s,2.5*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(6*s,-2*s,2.5*s,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// HUDポートレート用のシンプルな顔描画
function drawHeroFace(ch, pctx){
  const idx=CHARS.indexOf(ch);
  const c=ch.c;
  // 顔
  pctx.fillStyle=c.skin||'#FFCCAA';
  pctx.beginPath(); pctx.ellipse(0,-30,18,22,0,0,Math.PI*2); pctx.fill();
  // 目
  pctx.fillStyle='#222';
  pctx.beginPath(); pctx.ellipse(-7,-28,4,5,-.2,0,Math.PI*2); pctx.fill();
  pctx.beginPath(); pctx.ellipse(7,-28,4,5,.2,0,Math.PI*2); pctx.fill();
  pctx.fillStyle='#FFFFFF';
  pctx.beginPath(); pctx.ellipse(-6,-27,1.5,1.5,0,0,Math.PI*2); pctx.fill();
  pctx.beginPath(); pctx.ellipse(8,-27,1.5,1.5,0,0,Math.PI*2); pctx.fill();
  // 髪
  pctx.fillStyle=c.hair;
  pctx.beginPath();
  pctx.moveTo(-18,-28); pctx.quadraticCurveTo(-22,-55,0,-52);
  pctx.quadraticCurveTo(22,-55,18,-28); pctx.closePath(); pctx.fill();
  // 口
  pctx.strokeStyle='#AA7755'; pctx.lineWidth=1.5;
  pctx.beginPath(); pctx.arc(0,-22,5,0.1,Math.PI-.1); pctx.stroke();
}

// Boss HP bar canvas part (bars only, no text)
function drawBossHPBar(){
  if(!boss||boss.state==='intro'||boss.state==='dead') return;

  const phaseCol=boss.phase===2?'#FF8800':boss.phase===1?'#FF3300':'#CC1100';

}

function drawPrologue(){
  prologueTimer++;
  const ch=CHARS[prologueCharIdx];
  const scenes=PROLOGUE_SCENES[prologueCharIdx]||[];
  const scene=scenes[prologueLine]||{sp:'',tx:''};
  const isNarrator=scene.sp==='ナレーター';
  const isLumi=scene.sp==='ルミ';

  // キャラ別ADV背景
  const _pci=prologueCharIdx;
  if(_pci>=0&&_advBgReady[_pci]&&_advBgImgs[_pci]){
    const img=_advBgImgs[_pci];
    const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
    if(iw>0&&ih>0){
      const sc=Math.max(W/iw,H/ih);
      ctx.drawImage(img,(W-iw*sc)/2,(H-ih*sc)/2,iw*sc,ih*sc);
    }
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
  } else {
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#04021A');sky.addColorStop(1,'#0E0830');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  drawStars(0,.02);drawMoon(W*.85,70);
  ctx.fillStyle='#0D0D28';ctx.fillRect(0,H*.6,W,H*.4);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(0,0,W,H);

  }
  if(!isNarrator){
    // プレイヤー: 常に左 / ルミ: 常に右
    const playerX=W*.28, lumiX=W*.72;
    const playerAlpha=isLumi?0.42:1.0, lumiAlpha=isLumi?1.0:0.42;
    if(ch){
      const ca=ctx.globalAlpha; ctx.globalAlpha*=playerAlpha;
      drawHero(ch,playerX,H*.60,{state:!isLumi?'walk':'idle',frame:gTimer,facing:1});
      ctx.globalAlpha=ca;
    }
    const la=ctx.globalAlpha; ctx.globalAlpha*=lumiAlpha;
    drawLUMI(lumiX,H*.38,1.6,gTimer);
    ctx.globalAlpha=la;
  }

  const ch2=CHARS[prologueCharIdx];
  const brdCol=isNarrator?'#6644AA':isLumi?'#00AACC':(ch2?.c.magic||'#8844AA');
  const spCol=isNarrator?'#CCBBFF':isLumi?'#00EEFF':(ch2?.c.hair||'#FFFFFF');
  showPanel('dlg');
  updateDlgPanel(scenes,prologueLine,prologueTimer,brdCol,spCol);
}

  const stX=(W-N*bW-(N-1)*gap)/2;
  for(let i=0;i<N;i++){
    const ch=CHARS[i], bx=stX+i*(bW+gap), by=62, sel=i===selectedChar;
    if(sel){
      // 選択中：グロー＋背景グラデーション
      const grd=ctx.createLinearGradient(bx,by,bx,by+bH);
      grd.addColorStop(0,ch.c.hair+'22'); grd.addColorStop(1,ch.c.magic+'11');
      ctx.fillStyle=grd; ctx.fillRect(bx-4,by-4,bW+8,bH+8);
      ctx.strokeStyle=ch.c.hair; ctx.lineWidth=2;
      ctx.shadowColor=ch.c.hair; ctx.shadowBlur=14;
      ctx.strokeRect(bx,by,bW,bH); ctx.shadowBlur=0;
      // 上部カラーバー
      ctx.fillStyle=ch.c.hair; ctx.fillRect(bx,by,bW,3);
    } else {
      ctx.fillStyle='rgba(12,8,30,.8)'; ctx.fillRect(bx,by,bW,bH);
      ctx.strokeStyle='rgba(80,60,120,.5)'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bW,bH);
    }
    // キャラ描画 (ステータスバー撤去してスペース確保)
    drawHero(ch,bx+bW/2,by+200,{state:sel?'walk':'idle',frame:gTimer,facing:1,transformed:false});
    ctx.textAlign='center';
    ctx.font=`bold ${sel?15:13}px monospace`; ctx.fillStyle=sel?ch.c.hair:'#8899BB';
    ctx.shadowColor=sel?ch.c.hair:'transparent'; ctx.shadowBlur=sel?8:0;
    ctx.fillText(ch.name,bx+bW/2,by+16); ctx.shadowBlur=0;
    ctx.font='10px monospace'; ctx.fillStyle=sel?'#CCB8EE':'#445566';
    ctx.fillText(ch.sub,bx+bW/2,by+30);
    // タイプバッジ
    ctx.font='bold 10px monospace'; ctx.fillStyle=sel?ch.c.tAccent||'#FFCC44':'#445';
    ctx.fillText(ch.sub.split('/')[0].trim(),bx+bW/2,by+45);
  }
  // 選択▲マーカー
  if(Math.floor(gTimer/15)%2===0){
    ctx.font='22px monospace'; ctx.fillStyle='#FFCCEE';
    ctx.textAlign='center';
    const selCh=CHARS[selectedChar];
    ctx.shadowColor=selCh.c.hair; ctx.shadowBlur=8;
    ctx.fillText('▲',stX+selectedChar*(bW+gap)+bW/2,59);
    ctx.shadowBlur=0;
  }
  ctx.textAlign='left';
}

// ─── PLAYING (shared by PLAY + BOSS) ─────────────────────────
function drawPlaying(){
  const bgFns=[drawBG_School,drawBG_Street,drawBG_Park,drawBG_Dimension];
  applyZoom();
  (bgFns[currentStage]||drawBG_School)();
  drawComboBgFx();
  // Sort by Y depth
  const ents=[
    ...enemies.map(en=>({t:'en',en,wy:en.wy})),
    ...(boss?[{t:'boss',wy:boss.wy}]:[]),
    {t:'player',wy:player.wy}
  ].sort((a,b)=>a.wy-b.wy);
  for(const e of ents){
    if(e.t==='player'){
      drawHero(player.char,player.sx,player.sy,{
        state:player.state,frame:player.frame,facing:player.facing,
        flash:player.hurtTimer>0||player.invTimer>0,
        transformed:player.transformed,
        groundY: player.isJump ? (player.groundY - player.sy + player.sy) : null,
        // ジャンプ中は影をgroundY位置に描く
        ...(player.isJump ? {groundY: player.groundY} : {})
      });
    } else if(e.t==='en') drawEnemy(e.en);
    else if(e.t==='boss') drawBoss(boss);
  }
  drawParticles();
  drawRecoveryItems();
  drawProps();
  restoreZoom(); // ズーム解除（HUDは通常サイズ）
  if(gs===ST.BOSS) drawBossHPBar();
  drawHUD();
  drawHissatsuCutin();
  updateHtmlHUD();
  if(gs===ST.BOSS&&bossAnnounce&&gTimer<100) drawBossAnnounce();
  if(gTimer>=100) bossAnnounce=false;
}

// ─── STORY CUTSCENE ───────────────────────────────────────────
// Shared visual renderer for dialogue states (canvas part only)
function drawDialogueScene(scenes,lineIdx,timer,bgFn){
  // キャラ別ADV背景: assets/bg_01_01_0X.png があれば使用、なければ従来背景
  const _charIdx=player.char?CHARS.indexOf(player.char):-1;
  if(_charIdx>=0&&_advBgReady[_charIdx]&&_advBgImgs[_charIdx]){
    // 画像を画面全体にfitしつつアスペクト比を保つ（cover）
    const img=_advBgImgs[_charIdx];
    const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
    if(iw>0&&ih>0){
      const scale=Math.max(W/iw, H/ih);
      const dw=iw*scale, dh=ih*scale;
      ctx.drawImage(img, (W-dw)/2, (H-dh)/2, dw, dh);
    }
  } else {
    bgFn();
  }
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
  const scene=scenes[lineIdx]||{sp:'',tx:''};
  const ch=player.char;
  const isNarrator=scene.sp==='ナレーター';
  const isLumi=scene.sp==='ルミ';
  if(!isNarrator){
    // プレイヤー: 常に左 / ルミ: 常に右（固定）
    const playerX=W*.28, lumiX=W*.72;
    const playerAlpha=isLumi?0.42:1.0, lumiAlpha=isLumi?1.0:0.42;
    if(ch){
      const ca=ctx.globalAlpha; ctx.globalAlpha*=playerAlpha;
      drawHero(ch,playerX,H*.60,{state:!isLumi?'walk':'idle',frame:gTimer,facing:1});
      ctx.globalAlpha=ca;
    }
    const la=ctx.globalAlpha; ctx.globalAlpha*=lumiAlpha;
    drawLUMI(lumiX,H*.44,isLumi?1.5:1.1,gTimer);
    ctx.globalAlpha=la;
  }
}

function drawStory(){
  storyTimer++;
  const msgs=STORY_MSGS[storyMsgIdx]||[];
  const scene=msgs[storyLine]||{sp:'',tx:''};
  const ch=player.char;
  const isLumi=scene.sp==='ルミ';
  const brdCol=isLumi?'#00AACC':(ch?.c.magic||'#8844AA');
  const spCol=isLumi?'#00EEFF':(ch?.c.hair||'#FFFFFF');
  const bgFns=[drawBG_School,drawBG_Street,drawBG_Park,drawBG_Dimension];
  drawDialogueScene(msgs,storyLine,storyTimer,(bgFns[currentStage]||drawBG_School));
  showPanel('dlg');
  updateDlgPanel(msgs,storyLine,storyTimer,brdCol,spCol);
}

function drawEnding(){
  endingTimer++;
  const scene=ENDING_SCENES[endingLine]||{sp:'',tx:''};
  const isLumi=scene.sp==='ルミ';
  const ch=player.char;
  const brdCol=isLumi?'#00AACC':(ch?.c.magic||'#8844AA');
  const spCol=isLumi?'#00EEFF':(ch?.c.hair||'#FFFFFF');
  drawDialogueScene(ENDING_SCENES,endingLine,endingTimer,drawBG_Dimension);
  showPanel('dlg');
  updateDlgPanel(ENDING_SCENES,endingLine,endingTimer,brdCol,spCol);
}

// ─── CLEAR / FINAL / OVER ─────────────────────────────────────
function drawStageClear(){
  const bgFns=[drawBG_School,drawBG_Street,drawBG_Park,drawBG_Dimension];
  (bgFns[currentStage]||drawBG_School)();
  drawParticles();
  ctx.fillStyle='rgba(0,0,20,.65)';ctx.fillRect(0,0,W,H);
  const nextTxt=gTimer>100?(currentStage>=3?'ALL CLEAR！　エンディングへ…':`ステージ${currentStage+2}へ進む…`):'';
  setUI(`<div class="clear-text">
    <div style="font-size:clamp(26px,5.5vw,44px);font-weight:900;color:#FFFF88;
      text-shadow:0 0 30px #FFDD00,0 3px 8px rgba(0,0,0,.95);margin-bottom:.3em">
      ステージ${currentStage+1}　CLEAR！</div>
    <div style="font-size:clamp(15px,2.5vw,20px);font-weight:700;color:#FFCCEE;
      text-shadow:0 0 12px #FF88CC,0 2px 5px rgba(0,0,0,.9);margin-bottom:.4em">
      スコア: ${score}</div>
    <div style="font-size:clamp(13px,2vw,16px);color:#88FF88;
      text-shadow:0 0 10px #44CC44,0 2px 4px rgba(0,0,0,.9)">${nextTxt}</div>
  </div>`);
  if(gTimer>170){ advanceStage(); }
}

function drawFinalClear(){
  drawBG_Dimension();
  ctx.fillStyle='rgba(0,0,10,.75)';ctx.fillRect(0,0,W,H);
  if(gTimer%40===0) spawnMagicBurst(Math.random()*W+cameraX,GY_MIN-50+Math.random()*100,
    ['#FF88CC','#88CCFF','#FFFF44','#88FF88'][~~(Math.random()*4)],
    ['#FFCCEE','#CCEEFF','#FFFFAA','#CCFFCC'][~~(Math.random()*4)],true);
  drawParticles();
  const blink=gTimer>200&&Math.floor(gTimer/30)%2===0;
  setUI(`<div class="clear-text">
    <div style="font-size:clamp(30px,6vw,52px);font-weight:900;color:#FFFF44;
      text-shadow:0 0 40px #FFCC00,0 3px 10px rgba(0,0,0,.95);margin-bottom:.2em">
      ALL CLEAR！</div>
    <div style="font-size:clamp(15px,2.8vw,22px);font-weight:700;color:#FFDDFF;
      text-shadow:0 0 14px #CC88FF,0 2px 6px rgba(0,0,0,.9);margin-bottom:.2em">
      闇の君主を打ち破り、平和が戻った！</div>
    <div style="font-size:clamp(13px,2vw,18px);color:#CCBBFF;
      text-shadow:0 1px 5px rgba(0,0,0,.9);margin-bottom:.4em">
      ${player.char?.name||''}は魔法少女として輝き続ける…</div>
    <div style="font-size:clamp(15px,2.5vw,22px);font-weight:700;color:#FFFFCC;
      text-shadow:0 0 10px #FFDD00,0 2px 5px rgba(0,0,0,.9);margin-bottom:.6em">
      FINAL SCORE　${String(score).padStart(7,'0')}</div>
    <div style="font-size:clamp(18px,3vw,28px)">★★★★★★</div>
    <div style="font-size:clamp(12px,1.8vw,14px);color:#FFFF88;margin-top:.8em;
      text-shadow:0 0 8px #FFDD00,0 2px 4px rgba(0,0,0,.9);
      opacity:${blink?1:0}">タップ / Enter でタイトルへ</div>
  </div>`);
}

function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,.72)'; ctx.fillRect(0,0,W,H);
  const blink=gTimer>90&&Math.floor(gTimer/30)%2===0;
  const recHtml=score>=hiScore&&score>0
    ?`<div style="font-size:clamp(13px,2vw,16px);color:#FFDD44;text-shadow:0 0 10px #FFAA00,0 2px 4px rgba(0,0,0,.9)">NEW RECORD！</div>`
    :(hiScore>0?`<div style="font-size:clamp(12px,1.8vw,14px);color:#FFCC44;text-shadow:0 1px 4px rgba(0,0,0,.8)">HI-SCORE: ${hiScore}</div>`:'');
  setUI(`<div class="clear-text">
    <div style="font-size:clamp(30px,6.5vw,52px);font-weight:900;color:#FF3322;
      text-shadow:0 0 30px #FF0000,0 3px 10px rgba(0,0,0,.95);margin-bottom:.3em">
      GAME OVER</div>
    <div style="font-size:clamp(15px,2.5vw,20px);font-weight:700;color:#FFAAAA;
      text-shadow:0 1px 5px rgba(0,0,0,.9);margin-bottom:.2em">SCORE: ${score}</div>
    ${recHtml}
    <div style="font-size:clamp(12px,1.8vw,14px);color:#FFFF88;margin-top:.8em;
      text-shadow:0 0 8px #FFDD00,0 2px 4px rgba(0,0,0,.9);
      opacity:${blink?1:0}">Enter / スタート でリトライ</div>
  </div>`);
}

// ─── STAGE TRANSITIONS ────────────────────────────────────────
function startStage(stageIdx){
  currentStage=stageIdx;
  const counts=[18,22,26,30], waves=[4,5,5,6];
  stageEnemyCount=counts[stageIdx]||18;
  stageWaveSize=waves[stageIdx]||4;
  totalSpawned=0;totalKilled=0;
  enemies.length=0;particles.length=0;
  enemySpawnTimer=0;boss=null;bossAnnounce=false;
  cameraX=0; recoveryItems.length=0; itemSpawnTimer=0; bossTriggerFired=false;
  props.length=0; initProps();
  player.wx=300;player.wy=GY_MID;player.state='idle';
  for(let i=0;i<stageWaveSize;i++) spawnEnemy();
  clearUI(); _lastPanelMode=''; _lastHintKey='';
  gs=ST.INTRO;gTimer=0;
}
function advanceStage(){
  clearUI(); _lastPanelMode=''; _lastHintKey='';
  const nextIdx=currentStage+1;
  if(nextIdx<=3&&storyMsgIdx<STORY_MSGS.length){
    storyMsgIdx=currentStage;
    storyLine=0; storyTimer=0;
    gs=ST.STORY; gTimer=0;
  } else {
    startStage(nextIdx);
  }
}

// ─── MAIN LOOP ────────────────────────────────────────────────
function tapHint(msg='👆 タップ / ENTER で続ける'){
  return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    color:#FFFF88;font-size:clamp(14px,3.5vw,20px);font-weight:700;
    text-shadow:0 0 10px #FFDD00;font-family:'Hiragino Sans','Yu Gothic',sans-serif;
    cursor:pointer;letter-spacing:.05em" onclick="window._dlgAdvance()">${msg}</div>`;
}
let prevSelChar=0;
function loop(){
  requestAnimationFrame(loop);
  tickInput();
  gTimer++;
  updateShake();

  // Global keys
  if(jp('KeyP')||jp('Escape')){
    if(gs===ST.PLAY||gs===ST.BOSS){ paused=!paused; sfx('cursor'); }
  }
  if(jp('KeyM')){ sfxEnabled=!sfxEnabled; }
  if(paused){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.save();
    ctx.translate(_gt.ox+~~shakeX*_gt.scale, _gt.oy+~~shakeY*_gt.scale);
    ctx.scale(_gt.scale,_gt.scale);
    drawPlaying(); drawPause();
    ctx.restore(); drawVirtualPad(); return;
  }

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#020010';
  ctx.fillRect(0,0,canvas.width,canvas.height); // 余白を背景色で塗る
  ctx.save();
  ctx.translate(_gt.ox+~~shakeX*_gt.scale, _gt.oy+~~shakeY*_gt.scale);
  ctx.scale(_gt.scale,_gt.scale);

  // Low HP danger flash (red overlay pulse)
  if((gs===ST.PLAY||gs===ST.BOSS)&&player.hp>0&&player.hp/player.maxHp<0.25){
    const a=ctx.globalAlpha;
    ctx.globalAlpha=(0.06+Math.sin(gTimer*.18)*.05);
    ctx.fillStyle='#FF0000'; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=a;
  }

  switch(gs){
    case ST.TITLE:
      showPanel('none');
      drawTitle();
      drawTitleCursor();
      // ─ デバッグ表示（コントローラー診断）─
      {
        const pads=Array.from(navigator.getGamepads?navigator.getGamepads():[]);
        const connected=pads.filter(p=>p);
        ctx.save();
        ctx.font='bold 12px monospace'; ctx.textAlign='left';
        ctx.fillStyle='rgba(0,0,0,.75)'; ctx.fillRect(4,H-50,320,46);
        ctx.strokeStyle='rgba(180,100,255,.5)'; ctx.lineWidth=1;
        ctx.strokeRect(4,H-50,320,46);
        ctx.fillStyle='#EEFFCC';
        ctx.fillText(`GP: ${connected.length}台接続 | KJ:${Object.keys(KJ).filter(k=>KJ[k]).join(',') ||'なし'}`,10,H-32);
        ctx.fillStyle='#FFEEAA';
        if(connected[0]){
          const p=connected[0];
          const btns=p.buttons.map((b,i)=>b.pressed?i:'').filter(x=>x!=='').join(',');
          ctx.fillText(`BTN:${btns||'-'}  AX:[${(p.axes[0]||0).toFixed(2)}, ${(p.axes[1]||0).toFixed(2)}]`,10,H-14);
        } else {
          ctx.fillStyle='#FF8888';
          ctx.fillText('コントローラー未接続（接続後にボタンを一度押してください）',10,H-14);
        }
        // X座標デバッグ表示
        const trigX=BOSS_TRIGGER_X[currentStage]||3000;
        ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(4,4,260,18);
        ctx.fillStyle='#44FFAA'; ctx.font='bold 11px monospace';
        ctx.fillText(`X:${~~player.wx} / Trigger:${trigX} (${~~(player.wx/trigX*100)}%)  CAM:${~~cameraX}`,8,16);
        ctx.restore();
      }
      if(titlePhase===0){
        // フェーズ0：ニューゲーム/設定の選択
        if(jp('ArrowUp')||jp('ArrowLeft'))   titleCursor=Math.max(0,titleCursor-1);
        if(jp('ArrowDown')||jp('ArrowRight')) titleCursor=Math.min(1,titleCursor+1);
        if(jp('Enter')||jp('KeyZ')){
          if(titleCursor===0){ titlePhase=1; titlePhaseAnim=0; titleCursor=1; sfx('cursor'); }
          else { gs=ST.KEYCONFIG; gTimer=0; kcListening=null; kcCursor=0;
            const pads2=navigator.getGamepads?navigator.getGamepads():[];
            kcPrevButtons={};
            for(const pad of pads2||[]){ if(!pad) continue; pad.buttons.forEach((_,i2)=>{ kcPrevButtons[i2]=true; }); }
          }
        }
      } else {
        // フェーズ1：難易度選択
        if(jp('ArrowLeft'))  titleCursor=Math.max(0,titleCursor-1);
        if(jp('ArrowRight')) titleCursor=Math.min(2,titleCursor+1);
        if(jp('ArrowUp'))    titleCursor=Math.max(0,titleCursor-1);
        if(jp('ArrowDown'))  titleCursor=Math.min(3,titleCursor+1);
        if(jp('Enter')||jp('KeyZ')){
          if(titleCursor<=2){ window._setDiff(titleCursor); window._startGame(); }
          else { titlePhase=0; titleCursor=0; titlePhaseAnim=0; sfx('cursor'); }
        }
        if(jp('Escape')){ titlePhase=0; titleCursor=0; titlePhaseAnim=0; }
      }
      break;

    case ST.KEYCONFIG:
      showPanel('none');
      titlePanel.style.display='none';
      _kcTick(); // 専用入力処理（pollGamepadsと独立）
      drawKeyConfig();
      break;

    case ST.CSEL:
      showPanel('csel');
      updateCselPanel(CHARS[selectedChar]);
      drawCharSelect();
      if(jp('ArrowLeft')||jp('KeyA'))  { selectedChar=(selectedChar-1+CHARS.length)%CHARS.length; _cselAnimChar=''; sfx('cursor'); }
      if(jp('ArrowRight')||jp('KeyD')) { selectedChar=(selectedChar+1)%CHARS.length; _cselAnimChar=''; sfx('cursor'); }
      if(jp('Enter')||jp('KeyZ')||jp('Space')||jp('KeyX')){
        score=0; storyMsgIdx=0;
        initPlayer(selectedChar);
        prologueCharIdx=selectedChar;
        prologueLine=0; prologueTimer=0;
        clearUI(); _lastPanelMode=''; _lastHintKey=''; _cselAnimChar='';
        gs=ST.PROLOGUE; gTimer=0; sfx('select');
      }
      break;

    case ST.PROLOGUE:
      showPanel('dlg');
      drawPrologue();
      if(jp('Enter')||jp('KeyZ')||jp('Space')){
        const scenes=PROLOGUE_SCENES[prologueCharIdx]||[];
        const scene=scenes[prologueLine];
        const done=!scene||~~(prologueTimer*1.6)>=scene.tx.length;
        if(!done){ prologueTimer=9999; }
        else if(prologueLine<scenes.length-1){ prologueLine++; prologueTimer=0; sfx('cursor'); }
        else { startStage(0); sfx('select'); }
      }
      break;

    case ST.INTRO:
      showPanel('none');
      drawIntro();
      break;

    case ST.STORY:
      drawStory();
      if(jp('Enter')||jp('KeyZ')||jp('Space')){
        const msgs=STORY_MSGS[storyMsgIdx]||[];
        const sc=msgs[storyLine];
        const done=!sc||~~(storyTimer*1.6)>=sc.tx.length;
        if(!done){ storyTimer=9999; }
        else if(storyLine<msgs.length-1){ storyLine++; storyTimer=0; sfx('cursor'); }
        else { startStage(currentStage+1); player.transGauge=Math.floor(player.transGauge/2); sfx('select'); }
      }
      break;

    case ST.ENDING:
      drawEnding();
      if(jp('Enter')||jp('KeyZ')||jp('Space')){
        const sc=ENDING_SCENES[endingLine];
        const done=!sc||~~(endingTimer*1.6)>=sc.tx.length;
        if(!done){ endingTimer=9999; }
        else if(endingLine<ENDING_SCENES.length-1){ endingLine++; endingTimer=0; sfx('cursor'); }
        else { saveHiScore(); gs=ST.FINAL; gTimer=0; sfx('clear'); }
      }
      break;

    case ST.PLAY:
      showPanel(IS_TOUCH?'ctrl':'none');
      updatePhaseC();
      if(!isSlowmo()){ updatePlayer(); updateEnemies(); updateParticles(); updateRecoveryItems(); updateProps(); }
      drawPlaying();
      if(!boss && !bossTriggerFired && gs===ST.PLAY &&
         player.wx >= (BOSS_TRIGGER_X[currentStage]||3000)){
        bossTriggerFired=true; startBossState();
      }
      break;

    case ST.BOSS:
      showPanel(IS_TOUCH?'ctrl':'none');
      updatePhaseC();
      if(!isSlowmo()){ updatePlayer(); updateEnemies(); updateBoss(); updateParticles(); updateRecoveryItems(); updateProps(); }
      drawPlaying();
      break;

    case ST.CLEAR:
      setHint(tapHint(),'clear'); showPanel('hint');
      drawStageClear();
      break;

    case ST.FINAL:
      setHint(tapHint(),'final'); showPanel('hint');
      updateParticles(); drawFinalClear(); drawParticles();
      if(gTimer===1) saveHiScore();
      if(gTimer>200&&jp('Enter')){ clearUI(); _lastPanelMode=''; _lastHintKey=''; gs=ST.CSEL; gTimer=0; sfx('select'); }
      break;

    case ST.OVER:
      setHint(tapHint(),'over'); showPanel('hint');
      drawPlaying(); drawGameOver();
      if(gTimer===1) saveHiScore();
      if(gTimer>60&&jp('Enter')){ clearUI(); _lastPanelMode=''; _lastHintKey=''; gs=ST.CSEL; gTimer=0; sfx('select'); }
      break;
  }

  ctx.restore();
  drawVirtualPad();
}

setupPanelControls();
// dpad画像をセット
document.getElementById('dpad-img').src=_dpadImg.src;
loop();
</script>
