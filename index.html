<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>魔法少女 ナイトクルセイダーズ</title>
<style>
:root{--accent:#CC66FF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020010;touch-action:none;user-select:none}
body{display:block}
#wrap{
  position:fixed;inset:0;
  width:100vw;height:100dvh;
  overflow:hidden;
}
/* ─ Canvas: 全画面 ─ */
canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:#020010;
  display:block;
}
/* #ui は canvas と重ねる */
#ui{
  position:absolute;top:0;left:0;
  width:100%;
  z-index:5;pointer-events:none;overflow:hidden;
  font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;
}
#ui .stage-intro{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:90%}
#ui .stage-intro h1{font-size:clamp(22px,5vw,42px);font-weight:900;color:#ffee66;text-shadow:0 0 24px #ffcc00,0 3px 8px rgba(0,0,0,.9);margin-bottom:.25em}
#ui .stage-intro h2{font-size:clamp(15px,3vw,24px);font-weight:700;color:#ffccee;text-shadow:0 0 12px #ff88cc,0 2px 5px rgba(0,0,0,.9);margin-bottom:.6em}
#ui .stage-intro p{font-size:clamp(12px,2vw,16px);color:#e0e0e0;line-height:1.7}
/* ═══════════ BATTLE HUD (参考画像スタイル) ═══════════ */
/* 左上：キャラ情報パネル */
#ui .hud-char-panel{
  position:absolute;top:1%;left:1%;
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,rgba(0,0,0,.45),rgba(10,5,25,.4));
  border:1px solid rgba(180,140,80,.3);
  border-radius:7px;padding:5px 10px 5px 5px;
  width:clamp(180px,30%,240px);
  backdrop-filter:blur(2px);
}
#ui .hud-portrait-circle{
  width:40px;height:40px;min-width:40px;
  border-radius:50%;border:2px solid rgba(180,140,60,.7);
  overflow:hidden;flex-shrink:0;
  background:rgba(20,8,36,.8);
  display:flex;align-items:center;justify-content:center;
}
#ui .hud-portrait-circle canvas{
  width:40px !important;height:40px !important;display:block;flex-shrink:0;
}
#ui .hud-char-info{flex:1;min-width:0;overflow:hidden}
#ui .hud-charname{
  font-size:clamp(10px,1.6vw,13px);font-weight:700;
  color:#E8D890;text-shadow:0 0 8px rgba(220,180,60,.6);
  margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#ui .hud-bar-row{display:flex;align-items:center;gap:4px;margin-bottom:3px}
#ui .hud-bar-label{font-size:clamp(8px,1.1vw,10px);font-weight:700;color:#88AACC;width:16px;flex-shrink:0}
#ui .hud-bar-track{
  flex:1;height:9px;border-radius:5px;
  background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.12);
  overflow:hidden;position:relative;
}
#ui .hud-bar-fill{height:100%;border-radius:5px;transition:width .25s}
#ui .hud-bar-fill::after{content:'';position:absolute;top:0;left:0;right:0;height:45%;background:rgba(255,255,255,.25);border-radius:5px}
#ui .hud-lives{font-size:clamp(9px,1.3vw,11px);color:#FFCC44;margin-top:1px}
/* 右上：スコア・ステージ */
#ui .hud-top-right{position:absolute;top:1%;right:1%;text-align:right}
#ui .hud-score{font-size:clamp(13px,2vw,16px);font-weight:700;color:#FFE866;text-shadow:0 0 10px rgba(255,220,50,.5);font-family:monospace}
#ui .hud-stage{font-size:clamp(9px,1.3vw,11px);color:#8899AA;margin-top:2px}
/* ─ 変身UI用 ─ */
#ui .hud-magic-wrap{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:clamp(220px,55%,480px);text-align:center;
  padding-bottom:4px;
}
/* 宝石アイコン */
#ui .hud-gem{
  position:absolute;left:-32px;bottom:0;
  width:28px;height:28px;
  image-rendering:pixelated;
}
/* TRANSFORMATIONバナー */
#ui .trans-banner{
  position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);
  width:clamp(200px,50%,400px);
  pointer-events:none;animation:transPulse .6s ease-in-out infinite alternate;
}
@keyframes transPulse{from{opacity:.7;filter:brightness(1)}to{opacity:1;filter:brightness(1.3) drop-shadow(0 0 8px #FF88FF)}}
@keyframes bannerPulse{from{opacity:.85;filter:brightness(.95)}to{opacity:1;filter:brightness(1.2) drop-shadow(0 0 10px #CC88FF)}}
@keyframes bannerGlow{
  0%  {opacity:.3;filter:brightness(.3)}
  50% {opacity:1; filter:brightness(2.2) drop-shadow(0 0 20px #CC88FF)}
  100%{opacity:.3;filter:brightness(.3)}
}
@keyframes frameGlowScreen{
  0%  {opacity:.7;filter:brightness(.9)}
  50% {opacity:1; filter:brightness(1.5)}
  100%{opacity:.7;filter:brightness(.9)}
}
/* 変身中フレーム - ゲージバーに重なる */
#ui .trans-frame{
  position:absolute;
  left:50%;transform:translateX(-50%);
  /* ゲージの高さ(14px)+パディング+ラベル分を上に */
  bottom:calc(4px + 4px);
  width:calc(100% + 40px);
  pointer-events:none;animation:frameGlow .4s ease-in-out infinite alternate;
}
@keyframes frameGlow{from{filter:brightness(.8) hue-rotate(0deg)}to{filter:brightness(1.3) hue-rotate(20deg)}}
#ui .hud-magic-label{
  font-size:clamp(9px,1.4vw,11px);font-weight:700;letter-spacing:.15em;
  color:#AA88CC;margin-bottom:2px;
}
#ui .hud-magic-outer{
  position:relative;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(180,100,255,.4);
  border-radius:99px;height:14px;
  padding:1px;
  box-shadow:0 0 12px rgba(180,80,255,.2),inset 0 1px 0 rgba(255,255,255,.05);
}
#ui .hud-magic-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,#8822CC,#DD44FF,#FF88FF);
  transition:width .4s cubic-bezier(.22,1,.36,1);
  position:relative;
}
#ui .hud-magic-fill::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.3);border-radius:99px}
#ui .hud-magic-pct{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  font-size:clamp(9px,1.3vw,11px);font-weight:900;color:#FFCCFF;
  font-style:italic;text-shadow:0 0 6px #FF88FF;
}
/* 変身中ゲージ */
#ui .hud-trans-wrap{
  position:absolute;bottom:calc(2% + 22px);left:50%;transform:translateX(-50%);
  width:clamp(160px,40%,340px);text-align:center;
}
#ui .hud-trans-outer{
  background:rgba(0,0,0,.55);border:1px solid rgba(255,200,80,.35);
  border-radius:99px;height:10px;padding:1px;
}
#ui .hud-trans-fill{
  height:100%;border-radius:99px;
  transition:width .4s;
}
/* コンボ */
#ui .combo-txt{position:absolute;left:50%;top:45%;transform:translateX(-50%);font-weight:900;text-align:center;white-space:nowrap;text-shadow:0 0 20px currentColor,0 3px 8px rgba(0,0,0,.9)}
#ui .hissatsu-pop{position:absolute;top:28%;left:50%;transform:translateX(-50%);text-align:center;background:rgba(0,0,8,.88);border:1px solid rgba(200,150,50,.4);border-radius:8px;padding:10px 28px;white-space:nowrap}
#ui .hissatsu-pop .sub{font-size:clamp(11px,1.8vw,13px);font-weight:700;margin-bottom:4px}
#ui .hissatsu-pop .name{font-size:clamp(18px,3.5vw,26px);font-weight:900}
#ui .trans-name{position:absolute;top:50%;left:50%;transform:translateX(-50%);font-size:clamp(12px,2vw,15px);font-weight:700;white-space:nowrap}
#ui .title-text{position:absolute;top:18%;left:50%;transform:translateX(-50%);text-align:center;width:92%}
#ui .clear-text{position:absolute;top:25%;left:50%;transform:translateX(-50%);text-align:center;width:92%}

/* ════════════════════════════════════
   BOTTOM OVERLAY（1画面内に重ねる）
   ════════════════════════════════════ */
#ui-panel{
  position:absolute;
  left:0;right:0;
  height:160px;
  background:linear-gradient(180deg,rgba(6,2,20,.92) 0%,rgba(4,1,14,.97) 100%);
  border-top:2px solid rgba(180,100,255,.35);
  z-index:10;
  font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
/* 上部グロー線 */
#ui-panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.6;
}

/* ─ ダイアログパネル ─────────────────── */
#dlg-panel{
  display:none;width:100%;flex:1;
  flex-direction:row;gap:0;cursor:pointer;
  position:relative;
}
#dlg-panel.active{display:flex}

/* キャラアイコンエリア（左） */
#dlg-portrait{
  width:clamp(56px,14vw,80px);
  flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px;
  position:relative;
}
#dlg-portrait-canvas{
  display:block;
  width:clamp(52px,13vw,76px);
  height:auto;
  max-height:90%;
  image-rendering:pixelated;
  filter:drop-shadow(0 0 6px var(--dlg-col,#8855FF));
  background:none;border:none;
}

/* テキストエリア（右） */
#dlg-body{
  flex:1;display:flex;flex-direction:column;
  padding:8px 12px 6px 8px;
  min-width:0;
}
/* 角飾り */
#dlg-body::before,#dlg-body::after{
  content:'✦';font-size:10px;color:var(--dlg-col,#8855FF);opacity:.6;
  position:absolute;
}
#dlg-body::before{top:6px;right:8px}
#dlg-body::after{bottom:6px;left:6px}

#dlg-speaker{
  font-size:clamp(12px,3.2vw,16px);font-weight:700;
  margin-bottom:4px;flex-shrink:0;
  color:var(--dlg-col,#CC88FF);
  text-shadow:0 0 10px var(--dlg-col,#8855FF);
  display:flex;align-items:center;gap:6px;
}
#dlg-speaker::before{content:'★';font-size:.8em;opacity:.8}
#dlg-text{
  font-size:clamp(13px,3.2vw,16px);line-height:1.65;
  color:#EEE8FF;flex:1;
  text-shadow:0 1px 3px rgba(0,0,0,.8);
}
#dlg-footer{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:4px;flex-shrink:0;
}
#dlg-prompt{
  font-size:clamp(11px,2.5vw,13px);font-weight:700;
  color:var(--dlg-col,#CC88FF);
  animation:dlg-blink .6s ease-in-out infinite alternate;
}
#dlg-dots{display:flex;gap:5px;align-items:center}
.ddot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,.15);
  transition:background .2s;
}
.ddot.active{background:var(--dlg-col,#8855FF);box-shadow:0 0 6px var(--dlg-col,#8855FF)}
@keyframes dlg-blink{from{opacity:.2;transform:translateY(0)}to{opacity:1;transform:translateY(-2px)}}

/* ─ コントロールパネル ────────────────── */
#ctrl-panel{display:none;width:100%;flex:1;align-items:center;justify-content:space-between;padding:8px 16px}
#ctrl-panel.active{display:flex}

/* Dパッド */
#dpad{
  position:relative;
  width:clamp(130px,35vw,180px);
  height:clamp(130px,35vw,180px);
  flex-shrink:0;
}
.dp-up{grid-area:up}.dp-down{grid-area:down}
.dp-left{grid-area:left}.dp-right{grid-area:right}
.dp-ctr{grid-area:ctr;background:radial-gradient(circle,rgba(80,40,120,.6),rgba(20,10,50,.8));border:1px solid rgba(100,50,160,.3);border-radius:50%;}
.dp{
  background:linear-gradient(145deg,rgba(60,30,90,.9),rgba(20,10,50,.95));
  border:1.5px solid rgba(160,80,255,.4);
  border-radius:8px;color:#DDD;
  font-size:clamp(14px,3.5vw,20px);
  display:flex;align-items:center;justify-content:center;
  touch-action:none;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 6px rgba(0,0,0,.5);
  transition:background .07s,box-shadow .07s;
}
.dp:active,.dp.pressed{
  background:linear-gradient(145deg,rgba(140,60,200,.8),rgba(80,20,140,.9));
  box-shadow:0 0 10px rgba(180,80,255,.6),inset 0 1px 0 rgba(255,255,255,.2);
  color:#fff;
}
/* 画像dpad用タッチゾーン（背景なし・position:absolute） */
.dp-zone{
  position:absolute;
  touch-action:none;cursor:pointer;
  background:transparent;
  -webkit-tap-highlight-color:transparent;
}
.dp-zone:active{ background:rgba(255,255,255,.15);border-radius:50%; }
.dp-ctr{
  grid-area:ctr;
  background:radial-gradient(circle,rgba(80,40,120,.6),rgba(20,10,50,.8));
  border:1px solid rgba(100,50,160,.3);
  border-radius:50%;
}

/* アクションボタン */
#act-btns{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:8px;
  width:clamp(110px,30vw,150px);
  height:clamp(110px,30vw,150px);
}
.act{
  border-radius:50%;color:#fff;font-weight:900;
  font-size:clamp(11px,2.5vw,14px);letter-spacing:-.02em;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;cursor:pointer;
  border:2px solid rgba(255,255,255,.35);
  box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25);
  transition:filter .07s,transform .07s;
  position:relative;overflow:hidden;
}
.act::after{
  content:'';position:absolute;top:0;left:0;right:0;height:50%;
  background:rgba(255,255,255,.18);border-radius:50% 50% 0 0;
}
.act:active,.act.pressed{filter:brightness(1.7);transform:scale(.93)}

/* ポーズボタン */
#pause-btn{
  position:absolute;top:5px;right:8px;
  background:rgba(60,30,90,.7);
  border:1px solid rgba(160,80,255,.35);
  border-radius:20px;color:rgba(200,160,255,.8);
  font-size:clamp(10px,2.2vw,13px);
  padding:3px 10px;cursor:pointer;font-family:inherit;
  letter-spacing:.02em;
  transition:background .1s;
}
#pause-btn:active{background:rgba(120,60,180,.8)}

/* ─ ヒントパネル ─────────────────────── */
#hint-panel{display:none;width:100%;flex:1;align-items:center;justify-content:center;font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;pointer-events:auto;cursor:pointer}
#hint-panel.active{display:flex}

/* ─ キャラ選択下パネル ──────────────── */
#csel-panel{
  display:none;width:100%;flex:1;
  flex-direction:column;
  padding:6px 12px;position:relative;overflow:hidden;
  pointer-events:auto;
  justify-content:center;
}
#csel-panel.active{display:flex}
/* 上部ナビゲーションバー */
#csel-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 10px 4px;flex-shrink:0;
}
.csel-arrow{
  width:clamp(32px,8vw,44px);height:clamp(32px,8vw,44px);
  border-radius:50%;
  background:linear-gradient(145deg,rgba(80,40,120,.8),rgba(30,15,60,.9));
  border:1.5px solid rgba(180,80,255,.5);
  color:#CC88FF;font-size:clamp(16px,4vw,22px);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;touch-action:none;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
  transition:background .1s,box-shadow .1s;
}
.csel-arrow:active,.csel-arrow.pressed{
  background:linear-gradient(145deg,rgba(140,70,220,.9),rgba(80,30,160,.9));
  box-shadow:0 0 14px rgba(180,80,255,.7);
}
#csel-charname{
  font-size:clamp(14px,4vw,20px);font-weight:900;
  color:#fff;text-shadow:0 0 14px var(--char-col,#CC88FF);
  text-align:center;flex:1;
}
/* ステータスエリア */
#csel-stats{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:2px 12px 6px;gap:clamp(3px,1vh,6px);
}
.stat-row{display:flex;align-items:center;gap:8px}
.stat-label{
  font-size:clamp(9px,2vw,11px);font-weight:700;
  color:rgba(200,170,255,.7);letter-spacing:.06em;
  width:clamp(24px,6vw,32px);text-align:right;flex-shrink:0;
}
.stat-track{
  flex:1;height:clamp(7px,1.8vw,10px);
  background:rgba(255,255,255,.08);
  border-radius:99px;overflow:hidden;
  position:relative;
}
.stat-fill{
  height:100%;border-radius:99px;width:0%;
  transition:width .55s cubic-bezier(.22,1,.36,1);
  position:relative;
}
/* グラデーション光沢 */
.stat-fill::before{
  content:'';position:absolute;top:0;left:0;right:0;height:55%;
  background:rgba(255,255,255,.35);border-radius:99px;
}
.stat-fill::after{
  content:'';position:absolute;inset:0;border-radius:99px;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.15) 50%,transparent 100%);
}
.stat-val{
  font-size:clamp(9px,2vw,11px);font-weight:700;
  color:rgba(255,255,255,.6);min-width:24px;text-align:right;flex-shrink:0;
}
/* 決定ボタン */
#csel-confirm{
  margin:0 auto 6px;
  padding:clamp(5px,1.2vh,8px) clamp(24px,8vw,40px);
  background:linear-gradient(135deg,rgba(140,60,220,.9),rgba(80,20,160,.95));
  border:2px solid rgba(200,100,255,.6);
  border-radius:99px;color:#fff;font-family:inherit;
  font-size:clamp(13px,3.5vw,17px);font-weight:900;letter-spacing:.1em;
  cursor:pointer;touch-action:none;
  box-shadow:0 0 20px rgba(160,60,255,.4),inset 0 1px 0 rgba(255,255,255,.2);
  transition:box-shadow .1s,transform .1s;
}
#csel-confirm:active{
  transform:scale(.95);
  box-shadow:0 0 30px rgba(180,80,255,.7),inset 0 1px 0 rgba(255,255,255,.25);
}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="800" height="480"></canvas>
<div id="ui"></div>
<!-- Bottom UI Panel: dialogue or controls -->
<div id="ui-panel">
  <!-- Dialogue window -->
  <div id="dlg-panel" onclick="window._dlgAdvance()">
    <div id="dlg-portrait">
      <canvas id="dlg-portrait-canvas"></canvas>
    </div>
    <div id="dlg-body">
      <div id="dlg-speaker"></div>
      <div id="dlg-text"></div>
      <div id="dlg-footer">
        <div id="dlg-prompt"></div>
        <div id="dlg-dots"></div>
      </div>
    </div>
  </div>
  <!-- Touch controls (gameplay) -->
  <div id="ctrl-panel">
    <div id="dpad">
      <img id="dpad-img" src="" style="width:100%;height:100%;display:block;pointer-events:none">
      <div class="dp-zone" data-code="ArrowUp"    style="top:2%;left:28%;width:44%;height:36%"></div>
      <div class="dp-zone" data-code="ArrowLeft"  style="top:28%;left:2%;width:36%;height:44%"></div>
      <div class="dp-zone" data-code="ArrowRight" style="top:28%;right:2%;width:36%;height:44%"></div>
      <div class="dp-zone" data-code="ArrowDown"  style="bottom:2%;left:28%;width:44%;height:36%"></div>
    </div>
    <!-- 魔力ゲージエリア（中央） - 未使用（ゲーム画面下部に表示）-->
    <div id="magic-gauge-area" style="display:none"></div>
    <div id="act-btns">
      <div class="act" data-code="KeyZ"      style="background:linear-gradient(145deg,#CC2244,#881133)">攻撃</div>
      <div class="act" data-code="Space"     style="background:linear-gradient(145deg,#1155CC,#0A2A88)">跳躍</div>
      <div class="act" data-code="ShiftLeft" style="background:linear-gradient(145deg,#CC8800,#886600)">変身</div>
      <div class="act" data-code="KeyX"      style="background:linear-gradient(145deg,#8822BB,#551188)">必殺</div>
    </div>
    <button id="pause-btn" data-code="KeyP">⏸</button>
  </div>
  <!-- Hint / nav panel (clear, over) -->
  <div id="hint-panel"></div>
  <!-- Title panel（難易度はcanvas側で描画するため最小化） -->
  <div id="title-panel" style="display:none;width:100%;height:100%;pointer-events:auto"></div>
  <!-- Character select panel -->
  <div id="csel-panel" onclick="if(event.target===this||event.target.id==='csel-stats')window._dlgAdvance()">
    <div id="csel-nav">
      <div class="csel-arrow" id="csel-prev" onclick="window._pressKey('ArrowLeft')">‹</div>
      <div id="csel-charname">キャラクター名</div>
      <div class="csel-arrow" id="csel-next" onclick="window._pressKey('ArrowRight')">›</div>
    </div>

// ─ ゲーム変換行列 ─────────────────────────────────────────────
const uiPanel=document.getElementById('ui-panel');

const PANEL_H=160;
let _gt={scale:1, ox:0, oy:0};

function calcGameTransform(){
  const sw=window.innerWidth;
  const sh=window.innerHeight;
  canvas.width=sw;
  canvas.height=sh;
  // ゲームエリア：パネル分を除いた高さ
  const gameAreaH=sh-PANEL_H;
  const scaleX=sw/W, scaleY=gameAreaH/H;
  const scale=Math.min(scaleX,scaleY);
  const ox=(sw-W*scale)/2;
  const oy=0; // 上端に寄せる
  _gt={scale,ox,oy};
  // ゲーム描画の下端 = oy + H*scale
  const gameBottom=oy+H*scale;
  // パネルをゲーム描画の直下に配置
  uiPanel.style.top=~~gameBottom+'px';
  uiPanel.style.bottom='';
  uiPanel.style.height=PANEL_H+'px';
  // #ui オーバーレイもゲームエリアに合わせる
  uiEl.style.width=~~(W*scale)+'px';
  uiEl.style.height=~~(H*scale)+'px';
  uiEl.style.left=~~ox+'px';
  uiEl.style.top=~~oy+'px';
}
requestAnimationFrame(()=>{ calcGameTransform(); });
window.addEventListener('resize',calcGameTransform);

addEventListener('keydown',e=>{K_KB[e.code]=true; e.preventDefault();
  // 会話ステート中にZ/Jで会話を送る（実行時参照なので定義順は問題なし）
  if((e.code==='KeyZ'||e.code==='KeyJ')&&typeof DLG_STATES!=='undefined'&&DLG_STATES.has(gs)) window._dlgAdvance();
});
addEventListener('keyup',  e=>{K_KB[e.code]=false;});

// Standard Gamepad button → virtual key mapping
// 0=A/× → attack  1=B/○ → jump  2=X/□ → magic  3=Y/△ → transform
// 9=Start → Enter  12-15=Dpad
const GP_BTN={0:'KeyZ',1:'Space',2:'KeyX',3:'ShiftLeft',9:'Enter',
              12:'ArrowUp',13:'ArrowDown',14:'ArrowLeft',15:'ArrowRight'};
const DEAD=0.25; // analog stick deadzone

// Gamepad接続を確実に検出
let _gpConnected=false;
window.addEventListener('gamepadconnected', ()=>{ _gpConnected=true; });
window.addEventListener('gamepaddisconnected', ()=>{
  _gpConnected=navigator.getGamepads&&Array.from(navigator.getGamepads()).some(p=>p);
});

function pollGamepads(){
  for(const k of Object.keys(K_GP)) K_GP[k]=false;
  // Chrome: getGamepads()はgamepadconnected後でないとnullを返す場合がある
  const rawPads=navigator.getGamepads?navigator.getGamepads():[];
  const pads=Array.from(rawPads); // NodeListをArrayに変換
  for(const pad of pads){
    if(!pad) continue;
    // ボタン
    for(const [i,code] of Object.entries(GP_BTN)){
      if(pad.buttons[+i]?.pressed) K_GP[code]=true;
    }
    // 左スティック
    const ax=pad.axes[0]||0, ay=pad.axes[1]||0;
    if(ax<-DEAD) K_GP['ArrowLeft']=true;
    if(ax>+DEAD) K_GP['ArrowRight']=true;
    if(ay<-DEAD) K_GP['ArrowUp']=true;
    if(ay>+DEAD) K_GP['ArrowDown']=true;
    // D-pad（軸で実装されているコントローラー向け）
    const hx=pad.axes[6]||0, hy=pad.axes[7]||0;
    if(hx<-0.5) K_GP['ArrowLeft']=true;
    if(hx>+0.5) K_GP['ArrowRight']=true;
    if(hy<-0.5) K_GP['ArrowUp']=true;
    if(hy>+0.5) K_GP['ArrowDown']=true;
  }
}

function tickInput(){
  if(gs!=='keyconfig') pollGamepads();
  const all=new Set([...Object.keys(K_KB),...Object.keys(K_GP),...Object.keys(K_TC)]);
  for(const k of all) K[k]=(K_KB[k]||false)||(K_GP[k]||false)||(K_TC[k]||false);
  for(const k of all) KJ[k]=K[k]&&!KP[k];
  for(const k of Object.keys(KP)) if(!all.has(k)){ KJ[k]=false; delete KP[k]; }
  for(const k of all) KP[k]=K[k];
}
const jp=k=>KJ[k];
const kh=k=>K[k];

const AC=new (window.AudioContext||window.webkitAudioContext)();
let sfxEnabled=true;
// Resume on first interaction (browser policy)

function sfx(type){
  if(!sfxEnabled||AC.state==='suspended') return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  const t=AC.currentTime;
  switch(type){
    case 'atk1': o.frequency.setValueAtTime(280,t);o.frequency.linearRampToValueAtTime(180,t+.06);
      g.gain.setValueAtTime(.18,t);g.gain.linearRampToValueAtTime(0,t+.08);o.start(t);o.stop(t+.08);break;
    case 'atk2': o.frequency.setValueAtTime(360,t);o.frequency.linearRampToValueAtTime(200,t+.08);
      g.gain.setValueAtTime(.22,t);g.gain.linearRampToValueAtTime(0,t+.1);o.start(t);o.stop(t+.1);break;
    case 'atk3': o.type='sawtooth';o.frequency.setValueAtTime(500,t);o.frequency.linearRampToValueAtTime(120,t+.18);
      g.gain.setValueAtTime(.25,t);g.gain.linearRampToValueAtTime(0,t+.2);o.start(t);o.stop(t+.2);break;
    case 'magic': o.type='sine';
      o.frequency.setValueAtTime(900,t);o.frequency.linearRampToValueAtTime(1400,t+.1);o.frequency.linearRampToValueAtTime(600,t+.3);
      g.gain.setValueAtTime(.2,t);g.gain.linearRampToValueAtTime(0,t+.35);o.start(t);o.stop(t+.35);break;
    case 'jump': o.frequency.setValueAtTime(320,t);o.frequency.linearRampToValueAtTime(520,t+.12);
      g.gain.setValueAtTime(.15,t);g.gain.linearRampToValueAtTime(0,t+.14);o.start(t);o.stop(t+.14);break;
    case 'hurt': o.type='sawtooth';o.frequency.setValueAtTime(150,t);o.frequency.linearRampToValueAtTime(80,t+.15);
      g.gain.setValueAtTime(.3,t);g.gain.linearRampToValueAtTime(0,t+.18);o.start(t);o.stop(t+.18);break;
    case 'transform':
      // Rising magical chord
      [440,550,660,880].forEach((f,i)=>{
        const o2=AC.createOscillator(),g2=AC.createGain();
        o2.connect(g2);g2.connect(AC.destination);
        o2.type='sine';o2.frequency.setValueAtTime(f,t+i*.06);
        g2.gain.setValueAtTime(.15,t+i*.06);g2.gain.linearRampToValueAtTime(0,t+i*.06+.4);
        o2.start(t+i*.06);o2.stop(t+i*.06+.4);
      });
      o.stop(t); // mute default osc
      break;
    case 'bossHit': o.type='square';o.frequency.setValueAtTime(100,t);o.frequency.linearRampToValueAtTime(60,t+.12);
      g.gain.setValueAtTime(.28,t);g.gain.linearRampToValueAtTime(0,t+.15);o.start(t);o.stop(t+.15);break;
    case 'bossRoar':
      [80,120,160].forEach((f,i)=>{
        const o2=AC.createOscillator(),g2=AC.createGain();o2.connect(g2);g2.connect(AC.destination);
        o2.type='sawtooth';o2.frequency.setValueAtTime(f,t);o2.frequency.linearRampToValueAtTime(f*.5,t+.5);
        g2.gain.setValueAtTime(.2,t);g2.gain.linearRampToValueAtTime(0,t+.55);
        o2.start(t+i*.02);o2.stop(t+.6);
      });
      o.stop(t); break;
    case 'clear':
      [523,659,784,1047].forEach((f,i)=>{
        const o2=AC.createOscillator(),g2=AC.createGain();o2.connect(g2);g2.connect(AC.destination);
        o2.frequency.value=f;g2.gain.setValueAtTime(.18,t+i*.12);g2.gain.linearRampToValueAtTime(0,t+i*.12+.3);
        o2.start(t+i*.12);o2.stop(t+i*.12+.35);
      });
      o.stop(t); break;
    case 'over': o.type='sawtooth';
      o.frequency.setValueAtTime(200,t);o.frequency.linearRampToValueAtTime(80,t+.5);
      g.gain.setValueAtTime(.25,t);g.gain.linearRampToValueAtTime(0,t+.6);o.start(t);o.stop(t+.6);break;
    case 'select': o.frequency.setValueAtTime(660,t);g.gain.setValueAtTime(.12,t);g.gain.linearRampToValueAtTime(0,t+.06);o.start(t);o.stop(t+.06);break;
    case 'cursor': o.frequency.setValueAtTime(440,t);g.gain.setValueAtTime(.08,t);g.gain.linearRampToValueAtTime(0,t+.04);o.start(t);o.stop(t+.04);break;
    default: o.stop(t);
  }
}

function drawPortrait(ch, speaking){
  const PW=88, PH=108;
  dlgPortraitCanvas.width=PW; dlgPortraitCanvas.height=PH;
  dlgPortraitCtx.clearRect(0,0,PW,PH);
  if(!ch) return;
  const c=dlgPortraitCtx, s=4;
  const r=(x,y,w,h)=>c.fillRect(~~x,~~y,~~w,~~h);
  // キャラをPX=4・足元(44,140)として描画→頭部が画面中央に来る
  c.save(); c.translate(44,140);
  const OY=-28*s, hy=OY; // idle = wb=0
  const idx=CHARS.indexOf(ch);

  // ─ 顔共通パーツ（_face の portrait版） ─
  const mth=speaking?'open':(idx===1?'serious':idx===2?'neutral':'smile');
  const _fp=(hy2,ec,bc)=>{
    c.fillStyle='#F5C5A3'; r(-4*s,hy2+2*s,8*s,8*s);
    c.fillStyle='#ECA87A'; r(-3*s,hy2+9*s,6*s,s);
    c.fillStyle='#1A1818'; r(-4*s,hy2+5*s,3*s,2*s); r(s,hy2+5*s,3*s,2*s);
    c.fillStyle=ec; r(-4*s,hy2+5*s,2*s,2*s); r(s,hy2+5*s,2*s,2*s);
    c.fillStyle='#FFF'; r(-3*s,hy2+5*s,s,s); r(2*s,hy2+5*s,s,s);
    c.fillStyle=bc; r(-4*s,hy2+4*s,3*s,s); r(s,hy2+4*s,3*s,s);
    c.fillStyle='#BB4422';
    if(mth==='open'){ r(-2*s,hy2+7*s,4*s,2*s); c.fillStyle='#882211'; r(-s,hy2+8*s,2*s,s); }
    else if(mth==='smile') r(-2*s,hy2+8*s,4*s,s);
    else r(-s,hy2+8*s,3*s,s);
    const ga=c.globalAlpha; c.globalAlpha*=.35; c.fillStyle='#FF9999';
    r(-5*s,hy2+7*s,2*s,s); r(3*s,hy2+7*s,2*s,s); c.globalAlpha=ga;
  };

  switch(idx){
    case 0: { // ミミ: 茶ツインテール + 黒ボーラーハット
      c.fillStyle='#7A4A20'; r(-9*s,hy+2*s,3*s,14*s); r(6*s,hy+2*s,3*s,14*s);
      r(-9*s,hy+14*s,5*s,3*s); r(4*s,hy+14*s,5*s,3*s);
      c.fillStyle='#181616'; r(-7*s,hy-3*s,14*s,3*s); r(-4*s,hy-9*s,8*s,7*s);
      c.fillStyle='#2A2828'; r(-4*s,hy-4*s,8*s,s);
      c.fillStyle='#3A3030'; r(-4*s,hy-6*s,3*s,s); r(s,hy-6*s,3*s,s);
      _fp(hy,'#3366BB','#5A3008');
      c.fillStyle='#9A6030'; r(-5*s,hy,10*s,4*s); r(-7*s,hy+2*s,3*s,7*s); r(4*s,hy+2*s,3*s,6*s);
      c.fillStyle='#6A4018'; r(-5*s,hy,s,3*s); r(3*s,hy,s,3*s);
      c.fillStyle='#3366BB'; r(-9*s,hy+s,3*s,2*s); r(6*s,hy+s,3*s,2*s);
      break; }
    case 1: { // レイ: 青ボブ + 白ヘッドバンド
      c.fillStyle='#1A3399'; r(-7*s,hy+2*s,14*s,12*s); // ボブ全体
      c.fillStyle='#4477DD'; r(-6*s,hy,12*s,6*s); r(-7*s,hy+4*s,3*s,8*s); r(4*s,hy+4*s,3*s,8*s);
      c.fillStyle='#FFFFFF'; r(-5*s,hy-3*s,10*s,3*s); // ヘッドバンド
      c.fillStyle='#99BBFF'; r(-3*s,hy-4*s,6*s,2*s); // バンドハイライト
      _fp(hy,'#2255CC','#0A1A55');
      c.fillStyle='#4477DD'; r(-5*s,hy,10*s,4*s); r(-7*s,hy+2*s,3*s,8*s); r(4*s,hy+2*s,3*s,8*s);
      break; }
    case 2: { // エリン: 赤三つ編み + 緑セーラー服
      c.fillStyle='#881111'; r(-9*s,hy+2*s,4*s,14*s); r(5*s,hy+2*s,2*s,18*s); // 三つ編み
      r(-8*s,hy+14*s,3*s,4*s); r(4*s,hy+14*s,3*s,4*s);
      c.fillStyle='#CC3322'; r(-6*s,hy,12*s,6*s); r(-8*s,hy+4*s,3*s,9*s); r(5*s,hy+4*s,3*s,9*s);
      c.fillStyle='#FF8877'; r(-4*s,hy-2*s,8*s,3*s); // ハイライト
      _fp(hy,'#882222','#2A0A0A');
      c.fillStyle='#CC3322'; r(-5*s,hy,10*s,4*s); r(-7*s,hy+2*s,3*s,8*s); r(4*s,hy+2*s,3*s,8*s);
      break; }
    case 3: default: { // ハナ: ピンクツインテール + 猫耳ヘアバンド
      c.fillStyle='#DD4488'; r(-8*s,hy+2*s,3*s,14*s); r(5*s,hy+2*s,3*s,14*s);
      r(-8*s,hy+13*s,4*s,3*s); r(4*s,hy+13*s,4*s,3*s);
      // 猫耳
      c.fillStyle='#1A1A2A'; r(-5*s,hy-9*s,4*s,7*s); r(s,hy-9*s,4*s,7*s);
      c.fillStyle='#FF88BB'; r(-4*s,hy-7*s,2*s,5*s); r(2*s,hy-7*s,2*s,5*s);
      c.fillStyle='#CC2266'; r(-4*s,hy-5*s,8*s,s); // hairband
      _fp(hy,'#FF4499','#3A1A44');
      c.fillStyle='#DD4488'; r(-5*s,hy,10*s,4*s); r(-7*s,hy+2*s,3*s,8*s); r(4*s,hy+2*s,3*s,7*s);
      c.fillStyle='#AA2266'; r(-5*s,hy,s,3*s); r(4*s,hy,s,3*s);
      break; }
  }
  c.restore();
  document.getElementById('ui-panel').style.setProperty('--dlg-col', ch.c.magic||'#8855FF');
}

// ルミ（ロボット球体）のポートレート
function drawPortraitLumi(speaking){
  dlgPortraitCanvas.width=88; dlgPortraitCanvas.height=108;
  dlgPortraitCtx.clearRect(0,0,88,108);
  const c2d=dlgPortraitCtx;
  const bob=speaking?Math.sin(gTimer*.1)*3:0;

  // グロー
  c2d.save(); c2d.translate(44, 60+bob);
  c2d.globalAlpha=.25+Math.sin(gTimer*.08)*.1;
  const ag=c2d.createRadialGradient(0,0,10,0,0,38);
  ag.addColorStop(0,'#88EEFF'); ag.addColorStop(1,'transparent');
  c2d.fillStyle=ag; c2d.beginPath(); c2d.arc(0,0,38,0,Math.PI*2); c2d.fill();
  c2d.globalAlpha=1; c2d.restore();

  // ルミ画像（ロード済みなら）
  if(_lumiImgReady){
    const iw=_lumiImg.width, ih=_lumiImg.height;
    const drawW=84, drawH=84*(ih/iw);
    const dx=(88-drawW)/2, dy=4+bob;
    c2d.drawImage(_lumiImg, dx, dy, drawW, drawH);
  } else {
    // フォールバック：旧ドット絵
    c2d.save(); c2d.translate(44, 62+bob);
    const bg=c2d.createRadialGradient(-5,-5,2,0,0,22);
    bg.addColorStop(0,'#DDFBFF'); bg.addColorStop(.4,'#88DDEE'); bg.addColorStop(1,'#1188AA');
    c2d.fillStyle=bg; c2d.beginPath(); c2d.arc(0,0,22,0,Math.PI*2); c2d.fill();
    c2d.fillStyle='#00FFFF';
    c2d.beginPath(); c2d.arc(-8,-3,4,0,Math.PI*2); c2d.fill();
    c2d.beginPath(); c2d.arc(8,-3,4,0,Math.PI*2); c2d.fill();
    c2d.restore();
  }
  document.getElementById('ui-panel').style.setProperty('--dlg-col','#00AACC');
}

  const shown=Math.min(~~(timer*1.6),scene.tx.length);

  document.getElementById('ui-panel').style.setProperty('--dlg-col', brdCol);
  dlgSpeaker.innerHTML=isNarrator
    ?`<span>📖</span>&nbsp;ナレーター`
    :isLumi?`<span>🤖</span>&nbsp;ルミ`
    :`<span>✦</span>&nbsp;${spName}`;

  dlgPrompt.style.color=brdCol;
  dlgPrompt.style.animation=done?'dlg-blink .6s ease-in-out infinite alternate':'none';

  dlgDotsEl.innerHTML=scenes.map((_,i)=>{
    const active=i===lineIdx;
    return `<span class="ddot${active?' active':''}" style="${active?`background:${brdCol};box-shadow:0 0 6px ${brdCol}`:``}"></span>`;
  }).join('');
}

// タイトルのカーソル表示（canvas上に重ね描き）
function drawTitleCursor(){
  ctx.textAlign='center';
  // アニメーション進行
  if(titlePhase===1 && titlePhaseAnim<20) titlePhaseAnim++;

  if(titlePhase===0){
    // ── フェーズ0：ニューゲーム ＋ 設定 ──
    const btns=[{label:'ニューゲーム',idx:0,col:'rgba(120,50,200,.85)'},{label:'⚙ 設定',idx:1,col:'rgba(30,20,60,.7)'}];
    const bw=200, bh=38, gap=16;
    const totH=btns.length*(bh+gap)-gap;
    const sy=H*.58;
    btns.forEach(({label,idx,col},i)=>{
      const bx=W/2-bw/2, by=sy+i*(bh+gap);
      const sel=titleCursor===idx;
      ctx.fillStyle=sel?col:'rgba(20,10,50,.5)'; ctx.fillRect(bx,by,bw,bh);
      ctx.strokeStyle=sel?'#CC88FF':'rgba(80,50,130,.4)'; ctx.lineWidth=sel?2:1.5;
      ctx.strokeRect(bx,by,bw,bh);
      ctx.font=`bold ${sel?16:14}px 'Hiragino Sans','Yu Gothic',sans-serif`;
      ctx.fillStyle=sel?'#FFF':'rgba(150,120,190,.7)';
      ctx.shadowColor=sel?'#CC88FF':'transparent'; ctx.shadowBlur=sel?12:0;
      ctx.fillText(label,W/2,by+bh*.65); ctx.shadowBlur=0;
    });

  } else {
    // ── フェーズ1：難易度選択（下からスライドイン） ──
    const prog=titlePhaseAnim/20; // 0→1
    const ease=1-Math.pow(1-prog,3); // ease-out cubic
    const slideY=(1-ease)*60; // 下から60pxスライドイン

    ctx.font="12px 'Hiragino Sans','Yu Gothic',sans-serif";
    ctx.fillStyle=`rgba(180,140,255,${ease*.7})`; ctx.shadowBlur=0;
    ctx.fillText('── 難易度を選んでスタート ──',W/2,H*.58+slideY);

    const diffs=['かんたん','ふつう','むずかしい'];
    const dw=148, dgap=10, dy=H*.62+slideY;
    const dtotal=diffs.length*dw+(diffs.length-1)*dgap;
    diffs.forEach((d,i)=>{
      const dx=W/2-dtotal/2+i*(dw+dgap);
      const sel=(titleCursor===i), chosen=(difficulty===i);
      ctx.globalAlpha=ease;
      ctx.fillStyle=chosen?'rgba(120,50,200,.85)':sel?'rgba(60,30,100,.7)':'rgba(20,10,50,.5)';
      ctx.fillRect(~~dx,dy,dw,36);
      ctx.strokeStyle=sel?'#FFFFFF':chosen?'rgba(180,80,255,.8)':'rgba(80,50,130,.4)';
      ctx.lineWidth=sel?2.5:1.5; ctx.strokeRect(~~dx,dy,dw,36);
      ctx.font=`bold ${sel?16:14}px 'Hiragino Sans','Yu Gothic',sans-serif`;
      ctx.fillStyle=sel?'#fff':chosen?'#EEC8FF':'rgba(150,120,190,.7)';
      ctx.shadowColor=sel?'#CC88FF':'transparent'; ctx.shadowBlur=sel?10:0;
      ctx.fillText(d,~~dx+dw/2,dy+24); ctx.shadowBlur=0;
      ctx.globalAlpha=1;
    });

    // 戻るボタン
    const bw=120, bx=W/2-bw/2, by=H*.75+slideY;
    const bSel=titleCursor===3;
    ctx.globalAlpha=ease;
    ctx.fillStyle=bSel?'rgba(60,30,100,.85)':'rgba(20,10,50,.4)'; ctx.fillRect(bx,by,bw,28);
    ctx.strokeStyle=bSel?'rgba(200,100,255,.9)':'rgba(80,50,130,.3)';
    ctx.lineWidth=bSel?2:1; ctx.strokeRect(bx,by,bw,28);
    ctx.font=`${bSel?13:11}px 'Hiragino Sans','Yu Gothic',sans-serif`;
    ctx.fillStyle=bSel?'#DDD':'rgba(140,110,180,.5)';
    ctx.shadowColor=bSel?'#AA88FF':'transparent'; ctx.shadowBlur=bSel?8:0;
    ctx.fillText('← 戻る',bx+bw/2,by+19); ctx.shadowBlur=0;
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}

// 設定画面の全入力処理（ゲームのK_GP/KJとは完全独立）
function _kcTick(){
  const N=KC_ACTIONS.length+2;
  // ─ キーボード ─
  if(kcListening===null){
    if(KJ['ArrowUp']||KJ['KeyW'])   { kcCursor=(kcCursor-1+N)%N; sfx('cursor'); }
    if(KJ['ArrowDown']||KJ['KeyS']) { kcCursor=(kcCursor+1)%N; sfx('cursor'); }
    if(KJ['Enter']||KJ['KeyZ'])     _kcSelect();
    if(KJ['Escape'])                { gs=ST.TITLE; gTimer=0; return; }
  } else {
    for(const code of Object.keys(KJ)){
      if(!KJ[code]) continue;
      if(code==='Escape'){ kcListening=null; kcPrevButtons={}; return; }
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(code)) continue;
      _applyRemap(code,null); return;
    }
  }
  // ─ ゲームパッド（直接API） ─
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(const pad of pads){
    if(!pad) continue;
    for(let i=0;i<pad.buttons.length;i++){
      const pressed=!!pad.buttons[i]?.pressed;
      const prev=!!kcPrevButtons[i];
      if(pressed&&!prev){
        if(kcListening!==null){
          _applyRemap(null,i);
        } else {
          const navCode=GP_BTN[i];
          if(navCode==='ArrowUp'||navCode==='ArrowLeft')        { kcCursor=(kcCursor-1+N)%N; sfx('cursor'); }
          else if(navCode==='ArrowDown'||navCode==='ArrowRight') { kcCursor=(kcCursor+1)%N; sfx('cursor'); }
          else if(navCode==='Enter'||navCode==='KeyZ')           _kcSelect();
          else if(i===8||i===1)                                  { gs=ST.TITLE; gTimer=0; }
        }
      }
      kcPrevButtons[i]=pressed;
    }
    if(kcListening===null){
      const ay=pad.axes[1]||0;
      if(ay<-0.7&&!kcPrevButtons['sy_u']){ kcCursor=(kcCursor-1+N)%N; sfx('cursor'); }
      if(ay>+0.7&&!kcPrevButtons['sy_d']){ kcCursor=(kcCursor+1)%N; sfx('cursor'); }
      kcPrevButtons['sy_u']=ay<-0.7; kcPrevButtons['sy_d']=ay>+0.7;
    }
  }
}

function _kcSelect(){
  const N_ACT=KC_ACTIONS.length;
  if(kcCursor<N_ACT){
    kcListening=kcCursor;
    kcPrevButtons={};
    const pads=navigator.getGamepads?navigator.getGamepads():[];
    for(const pad of pads||[]){ if(!pad) continue; pad.buttons.forEach((_,i)=>{ kcPrevButtons[i]=!!pad.buttons[i]?.pressed; }); }
    sfx('cursor');
  } else if(kcCursor===N_ACT){
    window._resetKeyConfig();
  } else {
    gs=ST.TITLE; gTimer=0; titlePhase=0; titleCursor=0;
  }
}


function _keyLabel(code){
  const m={KeyZ:'Z',KeyX:'X',KeyJ:'J',KeyK:'K',KeyA:'A',KeyD:'D',KeyW:'W',KeyS:'S',
    Space:'スペース',ShiftLeft:'Shift',Enter:'Enter',Escape:'Esc',
    ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'};
  return m[code]||code.replace('Key','').replace('Arrow','?');
}

window._resetKeyConfig=function(){
  KC_ACTIONS.forEach(a=>{a.code=a.default;a.gpBtn=undefined;});
  Object.keys(GP_BTN).forEach(k=>delete GP_BTN[k]);
  Object.assign(GP_BTN,KC_DEFAULT_GP);
  kcListening=null;
  sfx('cursor');
};

function _applyRemap(code,gpBtnIdx){
  const a=KC_ACTIONS[kcListening];
  if(!a) return;
  if(gpBtnIdx!=null){
    // 既存マッピングのうち同じコードを持つものを削除
    Object.entries(GP_BTN).forEach(([b,c])=>{if(c===a.code)delete GP_BTN[b];});
    GP_BTN[gpBtnIdx]=a.code;
    a.gpBtn=gpBtnIdx;
  } else {
    a.code=code; a.gpBtn=undefined;
    Object.entries(GP_BTN).forEach(([b,c])=>{if(c===code)delete GP_BTN[b];});
  }
  kcListening=null;
  kcPrevButtons={};
  sfx('cursor');
}

// (dialogue advance + title/select/clear/over confirmation)
const PLAY_STATES=new Set(['play','boss']);
const DLG_STATES=new Set(['prologue','story','ending','clear','over','final']);

// canvas論理座標への変換（ゲーム変換行列を逆算）
function _canvasCoord(clientX, clientY){
  const rect=canvas.getBoundingClientRect();
  // CSS座標 → canvas物理ピクセル座標
  const px=(clientX-rect.left)*canvas.width/rect.width;
  const py=(clientY-rect.top)*canvas.height/rect.height;
  // ゲーム変換の逆算（scale,offset）
  const lx=(px-_gt.ox)/_gt.scale;
  const ly=(py-_gt.oy)/_gt.scale;
  return {lx,ly};
}

// canvas タップ → ステートに応じて処理
document.getElementById('wrap').addEventListener('click', e=>{
  _onCanvasTap(e.clientX, e.clientY);
});
document.getElementById('wrap').addEventListener('touchend', e=>{
  const t=e.changedTouches[0];
  _onCanvasTap(t.clientX, t.clientY);
  e.preventDefault();
},{passive:false});

function _onCanvasTap(cx,cy){
  const {lx,ly}=_canvasCoord(cx,cy);
  if(gs===ST.TITLE){    _titleTapXY(lx,ly);   return; }
  if(gs===ST.CSEL){     _cselTapXY(lx,ly);    return; }
  if(gs===ST.KEYCONFIG){ _kcTapXY(lx,ly);     return; }
  if(DLG_STATES.has(gs)) window._dlgAdvance();
}

// 設定画面のタッチ（drawKeyConfigと同じ座標）
function _kcTapXY(lx,ly){
  const rowH=46, startY=90;
  const N_ACT=KC_ACTIONS.length;
  // アクション行
  for(let i=0;i<N_ACT;i++){
    const y=startY+i*rowH;
    if(lx>=60&&lx<=W-60&&ly>=y-2&&ly<=y+rowH-4){
      if(kcListening===i){ kcListening=null; kcPrevButtons={}; }
      else { kcListening=i; kcPrevButtons={}; sfx('cursor'); }
      return;
    }
  }
  const btnY=startY+N_ACT*rowH+10;
  // リセットボタン
  if(lx>=W/2-200&&lx<=W/2-10&&ly>=btnY&&ly<=btnY+36){
    window._resetKeyConfig(); return;
  }
  // タイトルへ戻るボタン
  if(lx>=W/2+10&&lx<=W/2+210&&ly>=btnY&&ly<=btnY+36){
    gs=ST.TITLE; gTimer=0; titlePhase=0; titleCursor=0; sfx('cursor'); return;
  }
}

function _titleTapXY(lx,ly){
  if(titlePhase===0){
    // フェーズ0：ニューゲーム/設定
    const bw=200, bh=38, gap=16, sy=H*.58;
    // ニューゲーム
    if(lx>=W/2-bw/2&&lx<=W/2+bw/2&&ly>=sy&&ly<=sy+bh){
      titlePhase=1; titlePhaseAnim=0; titleCursor=1; sfx('cursor'); return;
    }
    // 設定
    if(lx>=W/2-bw/2&&lx<=W/2+bw/2&&ly>=sy+bh+gap&&ly<=sy+bh*2+gap){
      gs=ST.KEYCONFIG; gTimer=0; kcListening=null; kcCursor=0; kcPrevButtons={}; return;
    }
  } else {
    // フェーズ1：難易度選択
    const dw=148, dgap=10, dy=H*.62, dh=36;
    const dtotal=3*dw+2*dgap;
    for(let i=0;i<3;i++){
      const dx=W/2-dtotal/2+i*(dw+dgap);
      if(lx>=dx&&lx<=dx+dw&&ly>=dy&&ly<=dy+dh){
        window._setDiff(i); window._startGame(); return;
      }
    }
    // 戻る
    const bw=120, bx=W/2-60, by=H*.75, bh=28;
    if(lx>=bx&&lx<=bx+bw&&ly>=by&&ly<=by+bh){
      titlePhase=0; titleCursor=0; titlePhaseAnim=0; sfx('cursor');
    }
  }
}

function _cselTapXY(lx,ly){
  // キャラカードをタップ→選択、もう一度タップ（または同じカード）→決定
  const N=CHARS.length, bW=160, bH=230, gap=14;
  const stX=(W-N*bW-(N-1)*gap)/2;
  for(let i=0;i<N;i++){
    const bx=stX+i*(bW+gap), by=62;
    if(lx>=bx&&lx<=bx+bW&&ly>=by&&ly<=by+bH){
      if(selectedChar===i){
        // 同じキャラをもう一度タップ→決定
        window._dlgAdvance();
      } else {

function hitProp(pr,dmg){
  if(pr.dead) return;
  pr.hp-=dmg;
  spawnHitSpark(pr.wx,pr.wy,'#FFAA44',5);
  if(pr.hp<=0){
    pr.dead=true;

      pr.vx=player.facing*28; pr.vy=-6; pr.flying=true;

// アイテムの重力・自動吸引・スポーン管理
function updateRecoveryItems(){
  itemSpawnTimer++;
  const spawnRate=player.hp/player.maxHp<0.4?ITEM_SPAWN_RATE*0.5:ITEM_SPAWN_RATE;
  if(itemSpawnTimer>=spawnRate&&(gs===ST.PLAY||gs===ST.BOSS)){
    // 通常スポーンのハートはプレイヤー周辺に
    recoveryItems.push({
      wx:cameraX+W*.2+Math.random()*W*.6,
      wy:GY_MIN+30+Math.random()*(GY_MAX-GY_MIN-60),
      frame:0, life:600, type:'hp', gravity:false,
    });
    itemSpawnTimer=0;
  }
  for(let i=recoveryItems.length-1;i>=0;i--){
    const it=recoveryItems[i];
    it.frame++; it.life--;
    // ダンボール由来のアイテムは重力+自動吸引
    if(it.gravity){
      it.vy=(it.vy||0)+0.35;
      if(it.wy>GY_MAX){ it.wy=GY_MAX; it.vy*=-.4; }
      it.wy+=it.vy;
      const dx=player.wx-it.wx, dy=player.wy-it.wy;
      const d=Math.hypot(dx,dy)||1;
      if(d<160){ it.vx=(it.vx||0)+dx/d*2.5; it.vy+=dy/d*1.5; }
      it.wx+=(it.vx||0); it.vx=(it.vx||0)*.88;
    }
    // 取得判定
    if(Math.abs(player.wx-it.wx)<32&&Math.abs(player.wy-it.wy)<35){
      player.hp=Math.min(player.maxHp,player.hp+30);
      spawnHitSpark(it.wx,it.wy,'#88FF88',8);
      spawnDamageNum(it.wx,it.wy-20,'+30HP','#88FF88');
      sfx('select');
      recoveryItems.splice(i,1); continue;
    }
    if(it.life<=0) recoveryItems.splice(i,1);
  }
}

function drawRecoveryItems(){
  for(const it of recoveryItems){
    const sx=it.wx-cameraX, sy=it.wy;
    const bob=Math.sin(it.frame*.08)*4;

// Compute attack arm/weapon position (0=idle, 1=windup, 2=strike, 3=recover)
function _atkPos(frame,state){
  if(!state.startsWith('atk')) return 0;
  const f=Math.min(frame,11);

  if(f<2) return 0; if(f<5) return 1; if(f<8) return 2; return 3;

// ─── JUMP KICK (全キャラ共通) ──────────────────────────────────
function _drawKick(OY,s,ch,idx,transformed,frame){
  const col=transformed?(ch.c.tDress||ch.c.hair):(idx===2?'#1A3A1A':idx===1?'#1A2244':idx===3?'#1A1A2A':'#888078');
  const hair=ch.c.hair, eye=ch.c.eye||'#FF4499';
  const kick=Math.min(frame,8)/8; // 0→1 でキック伸展
  const legX=Math.round(8+10*kick)*s, legY=Math.round(-10+8*kick)*s;
  // 上体
  ctx.fillStyle=col; r(-5*s,OY+8*s,10*s,8*s);
  ctx.fillStyle='#F5C5A3'; r(-4*s,OY+2*s,8*s,8*s);
  ctx.fillStyle=hair; r(-5*s,OY-2*s,10*s,4*s); r(-6*s,OY+2*s,2*s,6*s); r(4*s,OY+2*s,2*s,5*s);
  // 目
  ctx.fillStyle='#1A1818'; r(-4*s,OY+4*s,2*s,2*s); r(s,OY+4*s,2*s,2*s);
  ctx.fillStyle=eye; r(-4*s,OY+4*s,s,2*s); r(s,OY+4*s,s,2*s);
  // 腕（バランス用）
  ctx.fillStyle=col; r(-9*s,OY+8*s,4*s,5*s); r(-9*s,OY+12*s,3*s,2*s);
  r(-Math.round(legX*.3),OY+10*s,4*s,5*s);
  // 軸足
  ctx.fillStyle=col; r(-4*s,OY+16*s,4*s,6*s);
  ctx.fillStyle='#111'; r(-5*s,OY+21*s,6*s,3*s);
  // キック足 (前方へ伸ばす)
  ctx.fillStyle=col; r(2*s,OY+legY,4*s,8*s);
  ctx.fillStyle='#111'; r(~~legX,OY+~~legY+4*s,8*s,4*s);
  // エフェクト
  if(transformed){
    const ga=ctx.globalAlpha; ctx.globalAlpha*=.5+kick*.4;
    ctx.fillStyle=ch.c.magic;
    ctx.beginPath();ctx.arc(~~legX+4*s,OY+~~legY+4*s,~~(12*kick*s),0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=ga;
  }
}

function _mimiN(OY,s,state,frame){
  // v8: 35frames, cell=256x160, anchor=(128,152)
  // fi: 0-3=idle(4f)  4-9=walk(6f)  10-13=atk1  14-17=atk2
  //     18-21=atk3  22-23=dash  24-29=jump  30-34=transform
  const ap=_atkPos(frame,state);
  let fi;
  if     (state==='idle'||state==='')   fi=Math.floor(frame/12)%4;          // 0-3
  else if(state==='walk')               fi=4+Math.floor(frame/6)%6;         // 4-9
  else if(state==='dash')               fi=4+Math.floor(frame/4)%6;         // 4-9 速め
  else if(state==='atk1')               fi=10+Math.min(ap,3);               // 10-13
  else if(state==='atk2')               fi=14+Math.min(ap,3);               // 14-17
  else if(state==='atk3'||state==='atk4'||state==='atk5') fi=18+Math.min(ap,3); // 18-21
  else if(state==='dashAtk')            fi=22+Math.floor(frame/4)%2;        // 22-23
  else if(state==='kick')               fi=4 +Math.floor(frame/4)%6;        // walk流用
  else if(state==='jump'||state==='air'){
    const jt=frame;
    fi=24+(jt<4?0:jt<9?1:jt<16?2:jt<22?3:jt<28?4:5);                      // 24-29
  }
  else if(state==='stagger'||state==='hurt') fi=24;   // jump[0]流用
  else if(state==='ko'||state==='dead')      fi=22;   // dash[0]流用
  else fi=Math.floor(frame/12)%4;

  const col=fi%_MIMI_COLS, row=Math.floor(fi/_MIMI_COLS);
  const sx=col*_MIMI_CW, sy=row*_MIMI_CH;
  const dx=-_MIMI_AX, dy=-_MIMI_AY;

  if(_mimiSheet.complete&&_mimiSheet.naturalWidth>0){
    ctx.drawImage(_mimiSheet,sx,sy,_MIMI_CW,_MIMI_CH,dx,dy,_MIMI_CW,_MIMI_CH);
  } else {
    const {wb,ls}=_wbls(state,frame);
    ctx.fillStyle='#888078'; r(-5*s,OY,10*s,26*s);
    ctx.fillStyle='#9A6030'; r(-4*s,OY-8*s,8*s,10*s);
  }
}

// バトル背景画像を描画（1600px横ループ）
function drawBG_StageImg(stageIdx){
  const img=_btBgImgs[stageIdx]; const ready=_btBgReady[stageIdx];
  if(!ready||!img) return false;
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  if(!iw||!ih) return false;
  const scale=H/ih;
  const sw=iw*scale, sh=H;
  // cameraXに合わせて横スクロール（ループ）
  const offset=(cameraX*0.6)%sw;
  // 最低2枚描画してシームレスに
  for(let x=-offset; x<W+sw; x+=sw){
    ctx.drawImage(img, ~~x, 0, ~~sw, ~~sh);
  }
  return true;
}

function drawHero(ch,cx,cy,{state='idle',frame=0,facing=1,flash=false,transformed=false,alpha=1,groundY=null}={}){
  const s=PX, idx=CHARS.indexOf(ch);
  ctx.save();
  // 影は地面に固定（ジャンプ中も地面Y=groundYに描く）
  const shadowY=groundY!=null?groundY:cy;
  ctx.translate(~~cx,~~shadowY);
  if(facing===-1) ctx.scale(-1,1);
  _shad(s); // 地面に影
  ctx.restore();
  // キャラ本体は実際のY位置に
  ctx.save();
  ctx.translate(~~cx,~~cy);
  if(facing===-1) ctx.scale(-1,1);
  ctx.globalAlpha=alpha*(flash&&Math.floor(frame/2)%2===0?.12:1);
  const OY=-28*s;
  if(state==='kick'){
    if(idx===1&&!transformed) _reiN(OY,s,state,frame); // レイはsprite kick
    else if(idx===2&&!transformed) _erinN(OY,s,state,frame); // エリンはsprite kick
    else if(idx===3&&!transformed) _hanaN(OY,s,state,frame); // ハナはsprite airKick
    else _drawKick(OY,s,ch,idx,transformed,frame); // 他キャラ共通
  } else if(transformed){
    switch(idx){
      case 0:_mimiT(OY,s,state,frame,ch.c);break;
      case 1:_reiT(OY,s,state,frame,ch.c);break;
      case 2:_erinT(OY,s,state,frame,ch.c);break;
      case 3:_hanaT(OY,s,state,frame,ch.c);break;
      default:_mimiT(OY,s,state,frame,ch.c);
    }
  } else {
    switch(idx){
      case 0:_mimiN(OY,s,state,frame);break;
      case 1:_reiN(OY,s,state,frame);break;
      case 2:_erinN(OY,s,state,frame);break;
      case 3:_hanaN(OY,s,state,frame);break;
      default:_mimiN(OY,s,state,frame);
    }
  }
  ctx.restore();
}

    ctx.fillStyle='#AA0000';
    re(-Math.round(5*s*sc),OY+Math.round(3*s*sc),Math.round(4*s*sc),Math.round(3*s*sc));
    re(Math.round(s*sc),OY+Math.round(3*s*sc),Math.round(4*s*sc),Math.round(3*s*sc));
    ctx.fillStyle='#FF2222';
    re(-Math.round(4*s*sc),OY+Math.round(3*s*sc),Math.round(2*s*sc),Math.round(2*s*sc));
    re(Math.round(2*s*sc),OY+Math.round(3*s*sc),Math.round(2*s*sc),Math.round(2*s*sc));
    const ag4=ctx.globalAlpha; ctx.globalAlpha*=.2+Math.sin(f*.15)*.1; ctx.fillStyle='#FF0000';
    ctx.beginPath();ctx.arc(-Math.round(3*s*sc),OY+Math.round(4*s*sc),Math.round(5*s*sc),0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(Math.round(3*s*sc),OY+Math.round(4*s*sc),Math.round(5*s*sc),0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=ag4;
  }

  // ヒットストップ：白フラッシュオーバーレイ
  if(hitstopFlash){
    ctx.globalAlpha=0.75; ctx.fillStyle='#FFFFFF';
    ctx.beginPath();ctx.arc(0,OY+Math.round(15*s*sc),Math.round(16*s*sc),0,Math.PI*2);ctx.fill();
  }
  // brute guard：青い盾エフェクト
  if(big&&en.state==='guard'){
    const ga=ctx.globalAlpha; ctx.globalAlpha*=.55+Math.sin(en.fTimer*.12)*.2;
    ctx.fillStyle='#2255FF';
    ctx.beginPath();ctx.arc(-Math.round(10*s*sc),OY+Math.round(12*s*sc),Math.round(14*s*sc),0,Math.PI*2);ctx.fill();
    ctx.globalAlpha*=.6; ctx.fillStyle='#AACCFF';
    ctx.beginPath();ctx.arc(-Math.round(10*s*sc),OY+Math.round(12*s*sc),Math.round(10*s*sc),0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=ga;
  }

  // HP bar
  if(en.hp<en.maxHp){
    const bw=Math.round(20*s*sc),bx=-bw/2,by=OY-Math.round(10*s*sc);
    ctx.fillStyle='#550000'; re(bx,by,bw,4);
    ctx.fillStyle='#FF2222'; re(bx,by,bw*(en.hp/en.maxHp),4);
  }
  ctx.restore();
}

// ─── DRAW BOSS ────────────────────────────────────────────────
function drawBoss(bo){
  const cx=bo.sx, cy=bo.sy, s=PX, f=bo.frame;
  const phase=bo.phase; // 0,1,2
  const sc=bo.stageId===1?1.5:bo.stageId===4?2.0:1.7;
  const bodyCol=phase===2?'#440011':phase===1?'#1A0040':'#0A0020';
  const eyeCol= phase===2?'#FF8800':phase===1?'#FF2222':'#EE0000';
  const hornCol=phase===2?'#FF6600':phase===1?'#CC0000':'#880000';

  ctx.save();
  ctx.translate(~~cx,~~cy);
  if(bo.facing===-1) ctx.scale(-1,1);
  if(bo.hurtTimer>0&&Math.floor(f/2)%2===0) ctx.globalAlpha=.15;

  const ls=Math.sin(f*.5)*(bo.state==='walk'?5:0);
  const OY=-Math.round(38*s*sc);
  const chg=bo.state==='charge';

  // Phase aura
  if(phase>0){
    const ta=ctx.globalAlpha;
    ctx.globalAlpha*=.15+Math.sin(f*.08)*.08;
    const aCol=phase===2?'#FF4400':'#6600CC';
    ctx.fillStyle=aCol;
    ctx.beginPath();ctx.arc(0,OY+20*s*sc,28*s*sc,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=ta;
  }

  // Shadow
  const pa=ctx.globalAlpha;
  ctx.globalAlpha*=.4; ctx.fillStyle='#000033';
  ctx.beginPath();ctx.ellipse(0,0,Math.round(24*s*sc),Math.round(6*s*sc),0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=pa;

  // Legs
  ctx.fillStyle=bodyCol;
  const lw=Math.round(7*s*sc), lh=Math.round(14*s*sc);
  re(-Math.round(9*s*sc),OY+Math.round(28*s*sc)+ls,lw,lh);
  re(Math.round(2*s*sc),OY+Math.round(28*s*sc)-ls,lw,lh);
  // Feet claws
  ctx.fillStyle='#000011';
  for(let i=0;i<4;i++){
    re(-Math.round((12-i*2)*s*sc),OY+Math.round(41*s*sc)+ls,Math.round(2*s*sc),Math.round(5*s*sc));
    re(Math.round((2+i*2)*s*sc),OY+Math.round(41*s*sc)-ls,Math.round(2*s*sc),Math.round(5*s*sc));
  }
  // Body
  ctx.fillStyle=bodyCol;
  re(-Math.round(13*s*sc),OY+Math.round(14*s*sc),Math.round(26*s*sc),Math.round(16*s*sc));
  // Shoulders (pauldrons)
  ctx.fillStyle=bodyCol;
  re(-Math.round(19*s*sc),OY+Math.round(12*s*sc),Math.round(8*s*sc),Math.round(12*s*sc));
  re(Math.round(11*s*sc),OY+Math.round(12*s*sc),Math.round(8*s*sc),Math.round(12*s*sc));
  ctx.fillStyle=hornCol;
  re(-Math.round(20*s*sc),OY+Math.round(11*s*sc),Math.round(9*s*sc),Math.round(3*s*sc));
  re(Math.round(11*s*sc),OY+Math.round(11*s*sc),Math.round(9*s*sc),Math.round(3*s*sc));
  // Arms
  const aS=chg?-5*s*sc:ls;
  ctx.fillStyle=bodyCol;
  re(-Math.round(20*s*sc),OY+Math.round(18*s*sc)+aS,Math.round(7*s*sc),Math.round(13*s*sc));
  re(Math.round(13*s*sc),OY+Math.round(18*s*sc)-aS,Math.round(7*s*sc),Math.round(13*s*sc));
  // Big claws
  ctx.fillStyle='#000011';
  for(let i=0;i<4;i++){
    re(-Math.round((22-i*2)*s*sc),OY+Math.round(30*s*sc)+aS,Math.round(2*s*sc),Math.round(6*s*sc));
    re(Math.round((14+i*2)*s*sc),OY+Math.round(30*s*sc)-aS,Math.round(2*s*sc),Math.round(6*s*sc));
  }
  // Chest gem
  ctx.fillStyle=phase===2?'#FF6600':phase===1?'#9900FF':'#4400AA';
  ctx.beginPath();ctx.arc(0,OY+Math.round(20*s*sc),Math.round(4*s*sc),0,Math.PI*2);ctx.fill();
  const ga=ctx.globalAlpha;
  ctx.globalAlpha*=.4; ctx.fillStyle=phase===2?'#FFAA00':'#CC66FF';
  ctx.beginPath();ctx.arc(0,OY+Math.round(20*s*sc),Math.round(8*s*sc),0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=ga;

  // Head
  ctx.fillStyle=bodyCol;
  re(-Math.round(12*s*sc),OY,Math.round(24*s*sc),Math.round(15*s*sc));
  // Crown / horns
  ctx.fillStyle=hornCol;
  re(-Math.round(12*s*sc),OY-Math.round(3*s*sc),Math.round(4*s*sc),Math.round(4*s*sc));
  re(-Math.round(3*s*sc),OY-Math.round(6*s*sc),Math.round(6*s*sc),Math.round(7*s*sc));
  re(Math.round(8*s*sc),OY-Math.round(3*s*sc),Math.round(4*s*sc),Math.round(4*s*sc));
  // Crown jewel
  ctx.fillStyle=eyeCol;
  re(-Math.round(s*sc),OY-Math.round(7*s*sc),Math.round(2*s*sc),Math.round(3*s*sc));
  // Eyes (large, menacing)
  ctx.fillStyle='#330000';
  re(-Math.round(9*s*sc),OY+Math.round(4*s*sc),Math.round(7*s*sc),Math.round(4*s*sc));
  re(Math.round(2*s*sc),OY+Math.round(4*s*sc),Math.round(7*s*sc),Math.round(4*s*sc));
  ctx.fillStyle=eyeCol;
  re(-Math.round(8*s*sc),OY+Math.round(4*s*sc),Math.round(5*s*sc),Math.round(3*s*sc));
  re(Math.round(3*s*sc),OY+Math.round(4*s*sc),Math.round(5*s*sc),Math.round(3*s*sc));
  ctx.fillStyle='#FFFFFF';
  re(-Math.round(7*s*sc),OY+Math.round(4*s*sc),Math.round(2*s*sc),Math.round(2*s*sc));
  re(Math.round(5*s*sc),OY+Math.round(4*s*sc),Math.round(2*s*sc),Math.round(2*s*sc));
  // Eye glow
  const eg=ctx.globalAlpha;
  ctx.globalAlpha*=.35+Math.sin(f*.1)*.15; ctx.fillStyle=eyeCol;
  ctx.beginPath();ctx.arc(-Math.round(6*s*sc),OY+Math.round(5*s*sc),Math.round(7*s*sc),0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(Math.round(6*s*sc),OY+Math.round(5*s*sc),Math.round(7*s*sc),0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=eg;

  // Mouth
  ctx.fillStyle='#220000';
  re(-Math.round(6*s*sc),OY+Math.round(10*s*sc),Math.round(12*s*sc),Math.round(4*s*sc));
  ctx.fillStyle=phase===2?'#FF8800':phase===1?'#880000':'#440000';
  for(let i=0;i<5;i++) re(-Math.round((5-i*2)*s*sc),OY+Math.round(10*s*sc),Math.round(s*sc),Math.round(2*s*sc));

  // Phase 2/3: dark projectile warning rings
  if(bo.state==='cast'&&phase>=1){
    const ta=ctx.globalAlpha;
    ctx.globalAlpha*=.5+Math.sin(f*.2)*.3;
    ctx.fillStyle=phase===2?'#FF8800':'#8800FF';
    re(-Math.round(s*sc),OY+Math.round(s*sc),Math.round(2*s*sc),Math.round(2*s*sc));
    ctx.globalAlpha=ta;
  }

  // HP bar (large, top of head)
  const bw=Math.round(50*s*sc), bx=-bw/2, by=OY-Math.round(14*s*sc);
  ctx.fillStyle='rgba(0,0,0,0.7)'; re(bx-2,by-2,bw+4,8);
  ctx.fillStyle='#550000'; re(bx,by,bw,5);
  ctx.fillStyle=phase===2?'#FF8800':phase===1?'#FF2200':'#CC1100';
  re(bx,by,bw*(bo.hp/bo.maxHp),5);
  ctx.fillStyle='rgba(255,255,255,0.2)'; re(bx,by,bw,2);

  ctx.restore();
}

// ─── BACKGROUND : SCHOOL ──────────────────────────────────────
// ─── ニチアサ魔法少女スタイル背景 ───────────────────────────────

// 共通：きらきらパーティクル
function drawSparkles(cx,speed,col1='#FFFFFF',col2='#FFDDFF'){
  for(let i=0;i<18;i++){
    const sx=~~(((-cx*speed+i*157+i*i*7)%WORLD_W+WORLD_W)%WORLD_W);
    if(sx<-20||sx>W+20) continue;
    const sy=30+(i*47)%((GY_MIN-60)|1);
    const flicker=Math.sin(gTimer*.08+i*1.3);
    const a=.4+flicker*.35;
    const sz=1+(flicker+1)*.8;
    ctx.save(); ctx.globalAlpha=a;
    ctx.fillStyle=i%2?col1:col2;
    ctx.fillRect(~~(sx-sz),~~(sy-sz),~~(sz*2),~~(sz*.6));
    ctx.fillRect(~~(sx-sz*.3),~~(sy-sz*1.4),~~(sz*.6),~~(sz*2.8));
    ctx.restore();
  }
}

// 共通：大きな雲
function drawCloud(x,y,w,col='#FFFFFF',alpha=1){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=col;
  const r=(x,y,r)=>{ctx.beginPath();ctx.arc(~~x,~~y,~~r,0,Math.PI*2);ctx.fill();};
  r(x,y,w*.22); r(x+w*.2,y-w*.12,w*.18); r(x+w*.38,y-w*.16,w*.21);
  r(x+w*.58,y-w*.1,w*.17); r(x+w*.72,y,w*.16);
  ctx.fillRect(~~x,~~y,~~(w*.72),~~(w*.22));
  ctx.restore();
}

// ─── Stage 1: 晴天の学校 ─────────────────────────────────────
function drawBG_School(){
  if(drawBG_StageImg(0)) return; // 画像あればそれを使用
  const cx=cameraX;
  // 快晴グラデーション空
  const sky=ctx.createLinearGradient(0,0,0,GY_MIN);
  sky.addColorStop(0,'#44AAFF'); sky.addColorStop(0.6,'#88CCFF'); sky.addColorStop(1,'#CCE8FF');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,GY_MIN);

  // 白い雲（パララックス）
  [[-.08,H*.08,200],[-.1,H*.12,140],[-.06,H*.05,170],[-.12,H*.15,120]].forEach(([sp,y,w],i)=>{
    const bx=~~(((-cx*Math.abs(sp)+i*380)%WORLD_W+WORLD_W)%WORLD_W-60);
    drawCloud(bx,y,w,'#FFFFFF',.92);
    drawCloud(bx+W*.5,y+15,w*.8,'#F0F8FF',.85);
  });

  // 校舎（白×水色・明るい）パララックス0.15
  const bx=~~(((-cx*.15)%WORLD_W+WORLD_W)%WORLD_W);
  for(let bi=0;bi<4;bi++){
    const bxOff=~~(((bx+bi*320)%WORLD_W+WORLD_W)%WORLD_W-80);
    if(bxOff>W+200||bxOff<-250) continue;
    const bH=160+(bi*40)%80, bW=200+(bi*30)%80;
    ctx.fillStyle='#F0F8FF'; ctx.fillRect(bxOff,GY_MIN-bH,bW,bH);
    ctx.fillStyle='#CCEEFF'; ctx.fillRect(bxOff,GY_MIN-bH,bW,8); // 屋根帯
    ctx.fillStyle='#AADDFF';
    for(let wy=0;wy<3;wy++) for(let wx=0;wx<3;wx++){
      ctx.fillRect(bxOff+16+wx*52,GY_MIN-bH+22+wy*38,32,28);
      ctx.fillStyle='#E8F8FF'; ctx.fillRect(bxOff+18+wx*52,GY_MIN-bH+24+wy*38,16,12);
      ctx.fillStyle='#AADDFF';
    }
    // 屋上フェンス
    ctx.fillStyle='#88CCFF';
    for(let f=0;f<Math.floor(bW/14);f++) ctx.fillRect(bxOff+f*14+4,GY_MIN-bH-12,4,12);
    ctx.fillRect(bxOff,GY_MIN-bH-2,bW,2);
  }

  // 桜の木（ピンク）パララックス0.4
  for(let i=0;i<16;i++){
    const tx=~~(((-cx*.4+i*230)%WORLD_W+WORLD_W)%WORLD_W-40);
    if(tx<-80||tx>W+60) continue;
    const th=60+(i*19)%40;
    ctx.fillStyle='#8B5A2B'; ctx.fillRect(tx+8,GY_MIN-th,7,th+10);
    // 花びら（淡いピンク×濃いピンク）
    const blossom=[[0,-th-10,28,'#FFB7C5'],[-10,-th-5,22,'#FF9EB5'],[12,-th-5,20,'#FF9EB5'],[0,-th+8,26,'#FFCCD5']];
    for(const [bx2,by,br,bc] of blossom){
      ctx.fillStyle=bc; ctx.globalAlpha=.9;
      ctx.beginPath();ctx.arc(tx+11+bx2,GY_MIN+by,br,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }
    // 花びら散り
    for(let p=0;p<3;p++){
      const px=tx+Math.sin(gTimer*.04+i+p)*20+p*8;
      const py=GY_MIN-th*.3+Math.cos(gTimer*.05+i*2+p)*15+(gTimer*.8+i*30+p*50)%th;
      ctx.fillStyle='#FFB7C5'; ctx.globalAlpha=.6;
      ctx.beginPath();ctx.ellipse(~~px,~~py,4,3,gTimer*.03,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }
  }

  // きらきら
  drawSparkles(cx,.2,'#FFFACD','#FFE4E1');
  drawGround('#6DC567','#5AB554');
  // 地面の草
  ctx.fillStyle='#7EDA78';
  for(let i=0;i<32;i++){
    const gx=~~(((-cx*.9+i*97)%WORLD_W+WORLD_W)%WORLD_W);
    ctx.fillRect(gx,GY_MIN-1,3,8); ctx.fillRect(gx+5,GY_MIN-1,3,6); ctx.fillRect(gx+10,GY_MIN-1,3,7);
  }
}

// ─── Stage 2: 昼の商店街 ─────────────────────────────────────
function drawBG_Street(){
  if(drawBG_StageImg(1)) return; // 画像あればそれを使用
  const cx=cameraX;
  // 晴天空（白みがかった水色）
  const sky=ctx.createLinearGradient(0,0,0,GY_MIN);
  sky.addColorStop(0,'#66BBFF'); sky.addColorStop(1,'#DDEEFF');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,GY_MIN);

  // 雲
  [[-.07,H*.07,180],[-.05,H*.11,130]].forEach(([sp,y,w],i)=>{
    const bx=~~(((-cx*Math.abs(sp)+i*500)%WORLD_W+WORLD_W)%WORLD_W-60);
    drawCloud(bx,y,w,'#FFFFFF',.88);
  });

  // カラフルな商店（明るい！）パララックス0.12

  const shops=[
    {dx:20, w:140, h:180, wall:'#FFF0E0', roof:'#FF8844', sign:'ラーメン', sCol:'#FF4400', flag:'#FF8844'},
    {dx:175,w:110, h:160, wall:'#F0F0FF', roof:'#AA66FF', sign:'カラオケ', sCol:'#8833FF', flag:'#AA66FF'},
    {dx:295,w:180, h:200, wall:'#EFFFEF', roof:'#44CC44', sign:'コンビニ', sCol:'#228822', flag:'#44CC44'},
    {dx:485,w:130, h:170, wall:'#FFF0F8', roof:'#FF66AA', sign:'薬局',    sCol:'#CC2288', flag:'#FF66AA'},
    {dx:625,w:160, h:190, wall:'#FFFDE0', roof:'#FFBB00', sign:'居酒屋',  sCol:'#CC8800', flag:'#FFBB00'},
    {dx:795,w:120, h:155, wall:'#F0FFFF', roof:'#00CCAA', sign:'ゲーセン',sCol:'#008877', flag:'#00CCAA'},
    {dx:925,w:145, h:175, wall:'#FFF4FF', roof:'#CC66FF', sign:'雑貨',    sCol:'#9933CC', flag:'#CC66FF'},

    // 窓（明るい）

      ctx.fillStyle='#AADDFF'; ctx.fillRect(sx+12+wx2*38,GY_MIN-sh.h+20+wy*36,24,20);
      ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(sx+13+wx2*38,GY_MIN-sh.h+21+wy*36,11,9);
    }
    // 看板（明るく大きく）
    ctx.fillStyle=sh.roof; ctx.fillRect(sx+4,GY_MIN-sh.h-46,sh.w-8,28);
    ctx.fillStyle='#FFFFFF'; ctx.strokeStyle=sh.roof; ctx.lineWidth=2;
    ctx.strokeRect(sx+6,GY_MIN-sh.h-44,sh.w-12,24);

    ctx.fillStyle='#66DD44'; ctx.beginPath();ctx.arc(tx+5,GY_MIN-100,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#88FF66'; ctx.beginPath();ctx.arc(tx+18,GY_MIN-95,14,0,Math.PI*2);ctx.fill();
  }
  // 人影（明るい）
  for(let i=0;i<16;i++){
    const px=~~(((-cx*.55+i*148)%WORLD_W+WORLD_W)%WORLD_W);
    if(px<-10||px>W+10) continue;
    const ph=22+(i*11)%16;
    const cols=['#FF88AA','#AACCFF','#FFCC66','#88DDAA','#FFAAFF'];
    ctx.fillStyle=cols[i%5]; ctx.fillRect(px,GY_MIN-ph,7,ph);
    ctx.beginPath();ctx.arc(px+3,GY_MIN-ph-6,5,0,Math.PI*2);ctx.fill();
  }
  drawSparkles(cx,.25,'#FFEEAA','#FFCCFF');
  drawGround('#E8D8A0','#D4C080');
  // 石畳
  ctx.fillStyle='rgba(0,0,0,.06)';
  for(let i=0;i<28;i++){
    const rx=~~(((-cx*.85+i*52)%WORLD_W+WORLD_W)%WORLD_W);
    ctx.fillRect(rx,GY_MIN+2,38,3);
  }
}

// ─── Stage 3: 夕焼け・マジカルパーク ────────────────────────────
function drawBG_Park(){
  if(drawBG_StageImg(2)) return; // 画像あればそれを使用
  const cx=cameraX;
  // サンセットグラデーション（魔法少女らしいピンク夕焼け）

  // ハートのシルエット（空）

  // ピンクの雲
  [[-.08,H*.06,200,'#FFCCDD'],[-.1,H*.14,150,'#FFB8CC']].forEach(([sp,y,w,col],i)=>{

    ctx.fillStyle='#FFFFFF';
    ctx.beginPath();ctx.moveTo(isx+iw/2,isy-35+bob);ctx.lineTo(isx+iw/2-3,isy-24+bob);ctx.lineTo(isx+iw/2+3,isy-24+bob);ctx.closePath();ctx.fill();
    // 下に続く光
    const lg=ctx.createLinearGradient(0,isy+bob,0,isy+40+bob);

    ctx.rotate(rot); ctx.strokeStyle='#FF88FF'; ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,mr,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,mr*.6,0,Math.PI*2);ctx.stroke();
    for(let p2=0;p2<6;p2++){
      const a2=p2/6*Math.PI*2;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a2)*mr,Math.sin(a2)*mr);ctx.stroke();
    }

  }

  // 浮遊する宝石型オブジェクト
  for(let i=0;i<8;i++){

    const gcols=['#FF44AA','#44AAFF','#FFCC00','#44FFAA','#FF8844'];

    ctx.beginPath();ctx.moveTo(gx,gy+bob-8);ctx.lineTo(gx+6,gy+bob);ctx.lineTo(gx,gy+bob+8);ctx.lineTo(gx-6,gy+bob);ctx.closePath();ctx.fill();
    ctx.fillStyle='#FFFFFF'; ctx.globalAlpha=.4;
    ctx.beginPath();ctx.moveTo(gx,gy+bob-8);ctx.lineTo(gx+6,gy+bob);ctx.lineTo(gx+2,gy+bob-3);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
  }

  drawSparkles(cx,.2,'#FF88FF','#88FFFF');

  // 魔法的な地面（紫の光るプラットフォーム）
  const grd2=ctx.createLinearGradient(0,GY_MIN,0,GY_MAX);
  grd2.addColorStop(0,'#440088'); grd2.addColorStop(1,'#220044');
  ctx.fillStyle=grd2; ctx.fillRect(0,GY_MIN,W,GY_MAX-GY_MIN);
  // 光るタイル
  for(let i=0;i<24;i++){
    const tx=~~(((-cx*.88+i*68)%WORLD_W+WORLD_W)%WORLD_W);
    const ta=.15+Math.sin(gTimer*.05+i*.4)*.1;
    ctx.fillStyle=`rgba(180,100,255,${ta})`; ctx.fillRect(tx,GY_MIN,48,4);
    ctx.fillStyle=`rgba(255,180,255,${ta*.5})`; ctx.fillRect(tx,GY_MIN+4,48,2);
  }
  ctx.fillStyle='rgba(200,150,255,.4)'; ctx.fillRect(0,GY_MIN,W,3);
}

// ─── PARTICLES ────────────────────────────────────────────────
const particles=[];
function spawnHitSpark(wx,wy,color,n=8){

    particles.push({wx,wy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:25,maxLife:25,color,type:'spark',r:2+Math.random()*3});
  }
}
function spawnMagicBurst(wx,wy,color,glow,big=false){
  const n=big?20:14;

    particles.push({wx,wy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:35,maxLife:35,color,glow,type:'magic',r:(big?5:3)+Math.random()*4});
  }
  particles.push({wx,wy,vx:0,vy:-1,life:18,maxLife:18,color:glow,type:'flash',r:big?70:40});
}
function spawnDamageNum(wx,wy,val,color='#FFFFFF'){

}
function spawnTransformBurst(wx,wy,ch){

function spawnBossSlamWave(wx,wy){
